<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#020617;color:#fff;padding:40px}

h1{text-align:center;margin-bottom:20px}
.container{max-width:800px;margin:auto;display:none}

/* LOGIN */
.login{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#020617;
}
.login-box{
  background:#111;padding:30px;border-radius:14px;width:320px;border:1px solid #222;
}
.login-box h2{text-align:center;margin-bottom:15px}

input,textarea{
  width:100%;margin:10px 0;padding:12px;border-radius:10px;border:none;
  background:#111;color:#fff;
}

button{
  padding:10px;border:none;border-radius:8px;
  background:linear-gradient(90deg,#00ffcc,#22c55e);
  cursor:pointer;font-weight:600;width:100%;
}

.card{background:#111;padding:15px;border-radius:12px;margin-top:15px}
.actions{display:flex;gap:10px;margin-top:10px}
.actions button{flex:1}

.error{color:red;text-align:center;margin-top:10px}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div id="error" class="error"></div>
  </div>
</div>

<!-- ADMIN -->
<div class="container" id="app">
  <h1>Admin Panel</h1>

  <input id="name" placeholder="Product Name">
  <input id="price" placeholder="Price">
  <input id="img" placeholder="Image URL">
  <textarea id="desc" placeholder="Description"></textarea>

  <button onclick="addProduct()">Add Product</button>
  <button onclick="downloadJSON()">Download JSON</button>

  <div id="list"></div>
</div>

<script>
// LOGIN
const USERNAME = "mecksha";
const PASSWORD = "MECKNOWN@9846";

function login(){
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;

  if(u === USERNAME && p === PASSWORD){
    localStorage.setItem('adminAuth','true');
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    document.getElementById('error').textContent = "Wrong login";
  }
}

// AUTO LOGIN CHECK
if(localStorage.getItem('adminAuth') === 'true'){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
}

// PRODUCTS
let products = JSON.parse(localStorage.getItem('products')) || [];
const list = document.getElementById('list');

function render(){
  list.innerHTML='';
  products.forEach((p,i)=>{
    list.innerHTML += `
      <div class="card">
        <b>${p.name}</b><br>
        ${p.price}
        <div class="actions">
          <button onclick="deleteProduct(${i})">Delete</button>
        </div>
      </div>
    `;
  });
}

function addProduct(){
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  const img = document.getElementById('img').value;
  const desc = document.getElementById('desc').value;

  if(!name || !price) return alert("Fill fields");

  products.push({name,price,img,desc});
  localStorage.setItem('products', JSON.stringify(products));

  render();
}

function deleteProduct(i){
  products.splice(i,1);
  localStorage.setItem('products', JSON.stringify(products));
  render();
}

// 🔥 DOWNLOAD JSON FILE
function downloadJSON(){
  const dataStr = JSON.stringify(products, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "products.json";
  a.click();

  URL.revokeObjectURL(url);
}

render();
</script>

</body>
</html>
