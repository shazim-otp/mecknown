<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#020617;color:#fff;padding:40px}

h1{margin-bottom:20px;text-align:center}
.container{max-width:800px;margin:auto;display:none}

/* LOGIN */
.login{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:#020617;
}
.login-box{
  background:#111;padding:30px;border-radius:14px;width:320px;border:1px solid #222;
}
.login-box h2{margin-bottom:15px;text-align:center}

input,textarea{
  width:100%;margin:10px 0;padding:12px;border-radius:10px;border:none;outline:none;
  background:#111;color:#fff;
}

button{
  padding:10px 14px;
  background:linear-gradient(90deg,#00ffcc,#22c55e);
  border:none;border-radius:8px;font-weight:600;cursor:pointer;
  margin-top:10px;
}

.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1}

.card{background:#111;padding:15px;border-radius:12px;margin-top:15px;border:1px solid #222}
.card img{width:100%;border-radius:10px;margin-bottom:10px}
.actions{display:flex;gap:10px;margin-top:10px}
.actions button{flex:1}

.preview{margin-top:30px;background:#111;padding:20px;border-radius:12px}
pre{white-space:pre-wrap;word-break:break-word}

.top-actions{display:flex;gap:10px;margin-bottom:10px}
.error{color:#ef4444;font-size:14px;margin-top:6px;text-align:center}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="error" id="error"></div>
  </div>
</div>

<div class="container" id="app">
  <h1>Shop Admin Panel</h1>

  <button onclick="logout()" style="float:right;margin-bottom:10px">Logout</button>

  <input type="text" id="name" placeholder="Product Name">
  <input type="text" id="price" placeholder="Price">
  <input type="text" id="img" placeholder="Image URL">
  <textarea id="desc" placeholder="Description"></textarea>

  <div class="row">
    <button onclick="addOrUpdateProduct()" id="mainBtn">Add Product</button>
    <button onclick="resetForm()">Clear</button>
  </div>

  <div class="top-actions">
    <button onclick="exportJSON()">Export JSON</button>
    <button onclick="clearAll()">Clear All</button>
  </div>

  <div id="list"></div>

  <div class="preview">
    <h3>Live JSON</h3>
    <pre id="output"></pre>
  </div>
</div>

<script>
// 🔐 HIDDEN ROUTE CHECK
const REQUIRED_PATH = "/admin-8392";
if(!window.location.pathname.includes(REQUIRED_PATH)){
  document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px'>404 Not Found</h2>";
  throw new Error("Blocked access");
}

// 🔐 LOGIN
const USERNAME = "mecksha";
const PASSWORD = "MECKNOWN@9846";

function login(){
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;

  if(u === USERNAME && p === PASSWORD){
    localStorage.setItem('adminAuth','true');
    startSessionTimer();
    showApp();
  } else {
    document.getElementById('error').textContent = 'Invalid credentials';
  }
}

function showApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function logout(){
  localStorage.removeItem('adminAuth');
  location.reload();
}

if(localStorage.getItem('adminAuth') === 'true'){
  showApp();
  startSessionTimer();
}

// ⏳ SESSION TIMEOUT (5 MIN)
let timeout;
function startSessionTimer(){
  resetTimer();
  document.onmousemove = resetTimer;
  document.onkeypress = resetTimer;
}

function resetTimer(){
  clearTimeout(timeout);
  timeout = setTimeout(()=>{
    alert("Session expired");
    logout();
  }, 5 * 60 * 1000);
}

// 🧠 APP LOGIC
let products = JSON.parse(localStorage.getItem('products')) || [];
let editIndex = null;

const list = document.getElementById('list');
const output = document.getElementById('output');
const mainBtn = document.getElementById('mainBtn');

function save(){
  localStorage.setItem('products', JSON.stringify(products));
  output.textContent = JSON.stringify(products, null, 2);
  render();
}

function render(){
  list.innerHTML = '';
  products.forEach((p,i)=>{
    list.innerHTML += `
      <div class="card">
        <img src="${p.img}" onerror="this.style.display='none'">
        <b>${p.name}</b>
        <div>${p.price}</div>
        <small>${p.desc}</small>
        <div class="actions">
          <button onclick="editProduct(${i})">Edit</button>
          <button onclick="deleteProduct(${i})">Delete</button>
        </div>
      </div>
    `;
  });
}

function addOrUpdateProduct(){
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  const img = document.getElementById('img').value;
  const desc = document.getElementById('desc').value;

  if(!name || !price) return alert('Fill required fields');

  if(editIndex === null){
    products.push({name,price,img,desc});
  } else {
    products[editIndex] = {name,price,img,desc};
    editIndex = null;
    mainBtn.textContent = 'Add Product';
  }

  resetForm();
  save();
}

function editProduct(i){
  const p = products[i];
  document.getElementById('name').value = p.name;
  document.getElementById('price').value = p.price;
  document.getElementById('img').value = p.img;
  document.getElementById('desc').value = p.desc;
  editIndex = i;
  mainBtn.textContent = 'Update Product';
}

function deleteProduct(i){
  if(confirm('Delete this product?')){
    products.splice(i,1);
    save();
  }
}

function resetForm(){
  document.getElementById('name').value='';
  document.getElementById('price').value='';
  document.getElementById('img').value='';
  document.getElementById('desc').value='';
  editIndex = null;
  mainBtn.textContent = 'Add Product';
}

function clearAll(){
  if(confirm('Clear all products?')){
    products = [];
    save();
  }
}

function exportJSON(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products, null, 2));
  const dl = document.createElement('a');
  dl.setAttribute('href', dataStr);
  dl.setAttribute('download', 'products.json');
  dl.click();
}

save();
</script>

</body>
</html>
