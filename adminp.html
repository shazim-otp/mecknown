<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Mecknown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  background:#0a0a0a;
  color:#fff;
  font-family:sans-serif;
}

/* LOGIN */
.login-box{
  max-width:350px;
  margin:80px auto;
  padding:20px;
  background:#111;
  border-radius:12px;
  text-align:center;
}

/* PANEL */
.panel{
  max-width:900px;
  margin:20px auto;
  padding:20px;
  background:#111;
  border-radius:12px;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #333;
  background:#000;
  color:#fff;
}

button{
  padding:8px 12px;
  margin:5px;
  border:none;
  border-radius:6px;
  background:#fff;
  color:#000;
  cursor:pointer;
}

.card{
  border:1px solid #222;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

img{
  width:100%;
  max-height:120px;
  object-fit:cover;
  border-radius:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- PANEL -->
<div id="panel" class="panel" style="display:none;">

  <h2>Add Product</h2>
  <input id="name" placeholder="Name">
  <input id="price" placeholder="Price">
  <input id="desc" placeholder="Description">
  <input type="file" id="image">
  <button onclick="uploadProduct()">Upload</button>

  <hr>

  <h2>Products</h2>
  <div id="productList"></div>

  <hr>

  <h2>Orders</h2>
  <div id="orderList"></div>

  <button onclick="logout()">Logout</button>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
  authDomain: "mecknownshop.firebaseapp.com",
  projectId: "mecknownshop"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "shazamotp@gmail.com";

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(
    email.value,
    password.value
  ).catch(e=>error.innerText=e.message);
}

/* AUTH CHECK */
auth.onAuthStateChanged(user=>{
  if(user && user.email===ADMIN_EMAIL){
    loginBox.style.display="none";
    panel.style.display="block";
    loadProducts();
    loadOrders();
  }
});

/* LOGOUT */
function logout(){
  auth.signOut();
  location.reload();
}

/* UPLOAD PRODUCT (CLOUDINARY) */
async function uploadProduct(){
  const file=image.files[0];
  if(!file) return alert("Select image");

  const fd=new FormData();
  fd.append("file",file);
  fd.append("upload_preset","mecknown_upload");

  const res=await fetch("https://api.cloudinary.com/v1_1/do8z7aoj4/image/upload",{
    method:"POST",body:fd
  });

  const data=await res.json();

  await db.collection("products").add({
    name:name.value,
    price:price.value,
    description:desc.value,
    image:data.secure_url,
    createdAt:new Date()
  });

  alert("Added!");
}

/* LOAD PRODUCTS */
function loadProducts(){
  db.collection("products").orderBy("createdAt","desc")
  .onSnapshot(snap=>{
    productList.innerHTML="";

    snap.forEach(doc=>{
      const p=doc.data();

      productList.innerHTML+=`
      <div class="card">
        <img src="${p.image}">
        <h3>${p.name}</h3>
        <p>${p.description}</p>
        <p>₹${p.price}</p>

        <button onclick="deleteProduct('${doc.id}')">Delete</button>
        <button onclick="editProduct('${doc.id}','${p.name}','${p.price}','${p.description}')">Edit</button>
      </div>`;
    });
  });
}

/* DELETE */
function deleteProduct(id){
  if(confirm("Delete product?")){
    db.collection("products").doc(id).delete();
  }
}

/* EDIT */
function editProduct(id,name,price,desc){
  const newName=prompt("Name:",name);
  const newPrice=prompt("Price:",price);
  const newDesc=prompt("Desc:",desc);

  db.collection("products").doc(id).update({
    name:newName,
    price:newPrice,
    description:newDesc
  });
}

/* LOAD ORDERS (FROM GOOGLE SHEET API OR FIRESTORE IF YOU ADD LATER) */
async function loadOrders(){
  try{
    const res=await fetch("https://script.google.com/macros/s/AKfycbwYlsLWQZkH3iGed2VA3hWk63gw8mn559sI-iLNR-uzD6UXXlLkirN2DkJMdVLzoniMPA/exec");
    const data=await res.json();

    orderList.innerHTML="";

    data.reverse().forEach(o=>{
      orderList.innerHTML+=`
      <div class="card">
        <p><b>Email:</b> ${o.email}</p>
        <p><b>Product:</b> ${o.product}</p>
        <p><b>Price:</b> ₹${o.price}</p>
        <p><b>Phone:</b> ${o.phone || "N/A"}</p>
        <p><b>Time:</b> ${o.time || "N/A"}</p>
      </div>`;
    });

  }catch(err){
    orderList.innerHTML="Failed to load orders";
  }
}

</script>

</body>
</html>
