<!DOCTYPE html><html>
<head>
<title>MECK AI - Mecknown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico"><style>

/* ===== AI PAGE ===== */
.ai-container{
  position:relative;
  height: calc(100dvh - 110px); /* FIXED for mobile viewport */
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.ai-frame{
  flex:1;
  width:100%;
  height:100%;
  border:none;
  display:block;
}

/* ===== STATUS BAR ===== */
.ai-status{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 20px;
  background:#0f0f0f;
  border-bottom:1px solid #1f1f1f;
  font-size:14px;
}

#status-indicator{
  width:10px;
  height:10px;
  border-radius:50%;
}

.offline{
  background:red;
}

.online{
  background:limegreen;
}

/* ===== LOADING OVERLAY ===== */
.ai-overlay{
  position:absolute;
  inset:0;
  background:#0a0a0a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
  font-size:18px;
  color:#aaa;
}

</style></head><body><!-- NAVBAR --><nav>
  <h1>Mecknown</h1>
  <div class="menu-toggle" id="menu-toggle">
    <span></span><span></span><span></span>
  </div>
  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html" class="active">Meck AI</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav><!-- STATUS BAR --><div class="ai-status">
  <span id="status-indicator" class="offline"></span>
  <span id="status-text">Starting AI, please wait...</span>
</div><!-- AI SECTION --><div class="ai-container">  <!-- LOADING OVERLAY -->  <div class="ai-overlay" id="ai-overlay">
    <p>🚀 Starting AI... please wait</p>
  </div>  <!-- AI IFRAME -->  <iframe 
    src="https://www.meckai.mecknown.in/"
    class="ai-frame"
    id="ai-frame">
  </iframe></div><!-- SCRIPTS --><script>

/* ===== MOBILE MENU ===== */
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

if(toggle){
  toggle.addEventListener("click", function(){
    navLinks.classList.toggle("active");
    toggle.classList.toggle("active");
  });
}

/* ===== AI STATUS ===== */
const iframe = document.getElementById("ai-frame");
const overlay = document.getElementById("ai-overlay");
const statusText = document.getElementById("status-text");
const statusIndicator = document.getElementById("status-indicator");

iframe.addEventListener("load", () => {
  overlay.style.display = "none";

  statusText.innerText = "AI is Online";
  statusIndicator.classList.remove("offline");
  statusIndicator.classList.add("online");
});

</script></body>
</html>
