<!DOCTYPE html>
<html>
<head>
<title>Mecknown - Engineering Intelligent Futures</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="icon" href="favicon.ico">

<style>

/* ===== ROOT ===== */
:root{
--bg:#0a0a0a;
--card:#111111;
--border:#1f1f1f;
--text:#e5e5e5;
--muted:#9ca3af;
}

/* ===== GLOBAL ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
max-width:100%;
}

html, body{
overflow-x:hidden;
}

body{
background:var(--bg);
color:var(--text);
}

/* ===== PAGE TRANSITION ===== */
#page-transition{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0a0a0a;
z-index:9999;
opacity:1;
transition:0.5s;
}

#page-transition.hide{
opacity:0;
pointer-events:none;
}

/* ===== NAV ===== */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 6%;
position:sticky;
top:0;
background:rgba(10,10,10,0.7);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);
z-index:1000;
overflow:hidden;
}

nav h1{
font-weight:600;
}

nav ul{
display:flex;
gap:25px;
list-style:none;
}

nav a{
color:var(--muted);
text-decoration:none;
}

nav a:hover{
color:white;
}

/* MOBILE MENU */
.menu-toggle{
display:none;
flex-direction:column;
cursor:pointer;
z-index:1001;
}

.menu-toggle span{
width:25px;
height:2px;
background:white;
margin:4px 0;
}

/* SIDE MENU */
@media(max-width:768px){

.menu-toggle{display:flex;}

nav ul{
position:fixed;
top:0;
right:0;
height:100vh;
width:70%;
max-width:260px;
flex-direction:column;
background:#000;
padding:80px 20px;
transform:translateX(100%);
transition:0.35s ease;
box-shadow:-10px 0 30px rgba(0,0,0,0.6);
}

nav ul.active{
transform:translateX(0);
}

}

/* BACKDROP */
.nav-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
opacity:0;
pointer-events:none;
transition:0.3s;
z-index:999;
}

.nav-backdrop.active{
opacity:1;
pointer-events:auto;
}

/* HERO */
.hero{
text-align:center;
padding:120px 20px;
}

.hero h2{
font-size:42px;
background:linear-gradient(90deg,#fff,#9ca3af);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
color:var(--muted);
max-width:600px;
margin:20px auto;
}

.hero-buttons{
margin-top:25px;
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:12px 20px;
border:none;
border-radius:12px;
cursor:pointer;
}

.primary-btn{
background:white;
color:black;
}

.secondary-btn{
background:#1a1f27;
color:white;
}

button:hover{
transform:translateY(-3px);
}

button:active{
transform:scale(0.96);
}

/* SECTIONS */
.section{
padding:80px 6%;
text-align:center;
}

.card-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.card{
background:var(--card);
padding:25px;
border-radius:14px;
border:1px solid var(--border);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

/* FOOTER */
footer{
text-align:center;
padding:30px;
color:var(--muted);
}

</style>
</head>

<body>

<!-- PAGE TRANSITION -->
<div id="page-transition"></div>

<!-- NAV -->
<nav>
  <h1>Mecknown</h1>

  <div class="menu-toggle" id="menu-toggle">
    <span></span><span></span><span></span>
  </div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="course.html">Course</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- BACKDROP -->
<div class="nav-backdrop" id="nav-backdrop"></div>

<!-- HERO -->
<section class="hero">
  <h2>Engineering Intelligent Futures</h2>
  <p>Building robotics systems, smart gadgets, and AI-powered solutions.</p>

  <div class="hero-buttons">
    <a href="shop.html"><button class="primary-btn">Shop Products</button></a>
    <a href="services.html"><button class="secondary-btn">Explore Services</button></a>
  </div>
</section>

<!-- PROJECTS -->
<section class="section">
  <h2>Projects</h2>
  <div class="card-container" id="homeProjects"></div>
</section>

<footer>
© 2026 Mecknown. All Rights Reserved.
</footer>

<script>

/* PAGE LOAD */
window.addEventListener("load", ()=>{
  document.getElementById("page-transition").classList.add("hide");
});

/* PAGE TRANSITION */
document.querySelectorAll("a").forEach(link=>{
  link.addEventListener("click", function(e){
    const href = this.getAttribute("href");
    if(href && !href.startsWith("#")){
      e.preventDefault();
      document.getElementById("page-transition").classList.remove("hide");
      setTimeout(()=>{ window.location.href = href; }, 400);
    }
  });
});

/* MENU */
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");
const backdrop = document.getElementById("nav-backdrop");

toggle.addEventListener("click", ()=>{
  navLinks.classList.toggle("active");
  backdrop.classList.toggle("active");
});

backdrop.addEventListener("click", ()=>{
  navLinks.classList.remove("active");
  backdrop.classList.remove("active");
});

/* DISABLE DOUBLE TAP ZOOM */
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, false);

/* LOAD PROJECTS */
const homeContainer = document.getElementById("homeProjects");
const projects = JSON.parse(localStorage.getItem("projects")) || [];

if(projects.length === 0){
  homeContainer.innerHTML = "<p>No projects yet.</p>";
}

projects.forEach(proj=>{
  homeContainer.innerHTML += `
    <div class="card">
      <h3>${proj.title}</h3>
      <p>${proj.description}</p>
    </div>
  `;
});

</script>

</body>
</html>
