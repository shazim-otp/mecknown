<!DOCTYPE html>
<html>
<head>
<title>Mecknown - Engineering Intelligent Futures</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loader">
  <img src="logo.png" class="loader-logo">
</div>

<nav>
  <h1>Mecknown</h1>

  <div class="menu-toggle" id="menu-toggle">
    <span></span><span></span><span></span>
  </div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="course.html">Course</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<div class="nav-backdrop" id="nav-backdrop"></div>

<section class="section hero">
  <h2>Engineering Intelligent Futures</h2>
  <p>Advanced robotics, smart gadgets, and AI-powered solutions.</p>

  <div class="hero-buttons">
    <a href="shop.html"><button class="primary-btn">Shop</button></a>
    <a href="services.html"><button class="secondary-btn">Services</button></a>
  </div>
</section>

<section class="section">
  <h2>Projects</h2>
  <div class="card-container" id="homeProjects"></div>
</section>

<footer>© 2026 Mecknown</footer>

<script>

/* WAIT FOR DOM */
document.addEventListener("DOMContentLoaded", () => {

const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");
const backdrop = document.getElementById("nav-backdrop");

/* MENU */
toggle.onclick = () => {
  navLinks.classList.toggle("active");
  backdrop.classList.toggle("active");

  document.body.style.overflow =
    navLinks.classList.contains("active") ? "hidden" : "auto";
};

backdrop.onclick = () => {
  navLinks.classList.remove("active");
  backdrop.classList.remove("active");
  document.body.style.overflow = "auto";
};

/* LOADER */
window.addEventListener("load", ()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.display="none";
  },500);
});

/* PROJECTS */
const homeContainer = document.getElementById("homeProjects");
const projects = JSON.parse(localStorage.getItem("projects")) || [];

projects.forEach(p=>{
  homeContainer.innerHTML += `
    <div class="card">
      <h3>${p.title}</h3>
      <p>${p.description}</p>
    </div>
  `;
});

});
</script>

</body>
</html>
