<!DOCTYPE html>
<html>
<head>
  <title>Mecknown - Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, sans-serif;
      background:linear-gradient(135deg,#020617,#0f172a);
      color:#fff;
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      padding:25px;
      border-radius:20px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 0 40px rgba(0,255,213,0.1);
      animation:fadeIn 0.4s ease;
    }

    h2{text-align:center;margin-bottom:20px}

    input,textarea{
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:10px;
      border:1px solid #1f2937;
      background:#020617;
      color:#fff;
    }

    input:focus,textarea:focus{
      border-color:#00ffd5;
      box-shadow:0 0 10px rgba(0,255,213,0.2);
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#00ffd5;
      color:#000;
      font-weight:600;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{transform:scale(1.03)}

    .google{
      background:#fff;
      color:#000;
    }

    .hidden{display:none}

    .top-info{
      font-size:14px;
      color:#94a3b8;
      margin-bottom:10px;
      text-align:center;
    }

    .logout{
      color:#f87171;
      cursor:pointer;
      font-size:12px;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:scale(0.95)}
      to{opacity:1;transform:scale(1)}
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN CARD -->
  <div id="loginCard" class="card">
    <h2>Sign in</h2>

    <input id="loginEmail" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Password">

    <button onclick="emailLogin()">Login / Signup</button>
    <button class="google" onclick="googleLogin()">Continue with Google</button>
  </div>

  <!-- CONTACT CARD -->
  <div id="contactCard" class="card hidden">
    <div id="userInfo" class="top-info"></div>

    <h2>Contact Us</h2>

    <form id="contactForm">
      <input name="name" placeholder="Your Name" required>
      <input name="email" id="userEmail" required>
      <textarea name="message" rows="4" placeholder="Your Message"></textarea>
      <button id="submitBtn">Send Message</button>
    </form>
  </div>

</div>

<script>
/* Firebase */
try{
  firebase.initializeApp({
    apiKey: "AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
    authDomain: "mecknownshop.firebaseapp.com",
    projectId: "mecknownshop"
  });
}catch{}

const auth = firebase.auth();

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("contactCard").classList.remove("hidden");

    document.getElementById("userInfo").innerHTML =
      `👤 ${user.email} <div class='logout' onclick='logout()'>Logout</div>`;

    const emailField = document.getElementById("userEmail");
    emailField.value = user.email;
    emailField.readOnly = true;
  }
});

/* LOGIN */
function emailLogin(){
  const email = document.getElementById("loginEmail").value;
  const pass = document.getElementById("loginPass").value;

  if(!email || !pass) return alert("Fill fields");

  auth.signInWithEmailAndPassword(email,pass)
  .catch(()=>auth.createUserWithEmailAndPassword(email,pass));
}

function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

function logout(){
  auth.signOut();
  location.reload();
}

/* FORM */
let sending=false;

document.getElementById("contactForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(sending) return;

  sending=true;
  const btn=document.getElementById("submitBtn");
  btn.innerText="Sending...";
  btn.disabled=true;

  const fd=new FormData(e.target);
  fd.append("sheet","Contact");

  fetch("https://script.google.com/macros/s/AKfycbz4NzPug47y38qVTu9LiDLwp2a9X6J7Iygmq5qQUktEUjyEKp5R7FG5L_0XhMfFApVI/exec",{
    method:"POST",
    body:fd
  })
  .then(()=>alert("Message sent"))
  .catch(()=>alert("Error"))
  .finally(()=>{
    sending=false;
    btn.innerText="Send Message";
    btn.disabled=false;
  });
});
</script>

</body>
</html>
