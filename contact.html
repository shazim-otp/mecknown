<!DOCTYPE html>
<html>
<head>
  <title>Mecknown - Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, sans-serif;background:linear-gradient(135deg,#020617,#0f172a);color:#fff;}

    /* NAVBAR */
    nav{
      position:fixed;
      top:0;width:100%;
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 20px;
      background:rgba(0,0,0,0.6);
      backdrop-filter:blur(10px);
      z-index:1000;
    }

    nav h1{margin:0;font-size:20px}

    #nav-links{
      display:flex;gap:15px;list-style:none;
    }

    #nav-links a{color:#ccc;text-decoration:none;font-size:14px}
    #nav-links a:hover{color:#fff}

    .menu-toggle{
      display:none;
      flex-direction:column;
      cursor:pointer;
      gap:4px;
    }

    .menu-toggle span{
      width:22px;height:2px;background:#fff;
    }

    @media(max-width:768px){
      #nav-links{
        position:absolute;
        top:60px;right:0;
        background:#111;
        flex-direction:column;
        padding:15px;
        display:none;
      }

      #nav-links.active{display:flex}

      .menu-toggle{display:flex}
    }

    .container{
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:80px 20px 20px;
    }

    .card{
      width:100%;max-width:420px;
      padding:25px;border-radius:20px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 0 40px rgba(0,255,213,0.1);
    }

    h2{text-align:center;margin-bottom:20px}

    input,textarea{
      width:100%;padding:12px;margin:8px 0;
      border-radius:10px;border:1px solid #1f2937;
      background:#020617;color:#fff;
    }

    button{
      width:100%;padding:12px;margin-top:10px;
      border:none;border-radius:10px;
      background:#00ffd5;color:#000;font-weight:600;
      cursor:pointer;
    }

    .google{background:#fff;color:#000}
    .hidden{display:none}

    .top-info{text-align:center;color:#94a3b8;margin-bottom:10px}
    .logout{color:#f87171;cursor:pointer;font-size:12px}

    .loading-btn{opacity:0.7;pointer-events:none}
  </style>
</head>

<body>

<nav>
  <h1>Mecknown</h1>

  <div class="menu-toggle" id="menu-toggle">
    <span></span><span></span><span></span>
  </div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="course.html">Course</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<div class="container">

  <div id="loginCard" class="card">
    <h2>Sign in To Contact Us</h2>

    <input id="loginEmail" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Password">

    <button onclick="emailLogin(this)">Login / Signup</button>
    <button class="google" onclick="googleLogin(this)">Continue with Google</button>
  </div>

  <div id="contactCard" class="card hidden">
    <div id="userInfo" class="top-info"></div>

    <h2>Contact Us</h2>

    <form id="contactForm">
      <input name="name" placeholder="Your Name" required>
      <input name="email" id="userEmail" required>
      <textarea name="message" rows="4" placeholder="Your Message"></textarea>
      <button id="submitBtn">Send Message</button>
    </form>
  </div>

</div>

<script>

/* MENU */
document.getElementById("menu-toggle").addEventListener("click",()=>{
  document.getElementById("nav-links").classList.toggle("active");
});

/* FIREBASE */
try{
  firebase.initializeApp({
    apiKey:"AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
    authDomain:"mecknownshop.firebaseapp.com",
    projectId:"mecknownshop"
  });
}catch{}

const auth=firebase.auth();

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("contactCard").classList.remove("hidden");

    document.getElementById("userInfo").innerHTML=
      `👤 ${user.email} <div class='logout' onclick='logout()'>Logout</div>`;

    const emailField=document.getElementById("userEmail");
    emailField.value=user.email;
    emailField.readOnly=true;
  }
});

function emailLogin(btn){
  btn.classList.add("loading-btn");

  const email=document.getElementById("loginEmail").value;
  const pass=document.getElementById("loginPass").value;

  if(!email||!pass){alert("Fill fields");btn.classList.remove("loading-btn");return;}

  auth.signInWithEmailAndPassword(email,pass)
  .catch(()=>auth.createUserWithEmailAndPassword(email,pass))
  .finally(()=>btn.classList.remove("loading-btn"));
}

function googleLogin(btn){
  btn.classList.add("loading-btn");
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).finally(()=>btn.classList.remove("loading-btn"));
}

function logout(){auth.signOut();location.reload();}

let sending=false;

document.getElementById("contactForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(sending)return;

  sending=true;
  const btn=document.getElementById("submitBtn");
  btn.innerText="Sending...";
  btn.classList.add("loading-btn");

  const fd=new FormData(e.target);
  fd.append("sheet","Contact");

  fetch("https://script.google.com/macros/s/AKfycbz4NzPug47y38qVTu9LiDLwp2a9X6J7Iygmq5qQUktEUjyEKp5R7FG5L_0XhMfFApVI/exec",{
    method:"POST",body:fd
  })
  .then(()=>alert("Message sent"))
  .catch(()=>alert("Error"))
  .finally(()=>{
    sending=false;
    btn.innerText="Send Message";
    btn.classList.remove("loading-btn");
  });
});

</script>

</body>
</html>
