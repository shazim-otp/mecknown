<!DOCTYPE html>
<html>
<head>
  <title>Mecknown - Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <style>
    body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0}

    .section{padding:40px;text-align:center}

    .auth-modal{
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.7);
    }

    .auth-card{
      background:#111;
      padding:25px;
      border-radius:16px;
      width:90%;
      max-width:350px;
    }

    button{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:10px;
      cursor:pointer;
    }

    .google{background:#fff;color:#000}
    .email{background:#00ffd5;color:#000}

    .hidden{display:none}

    input,textarea{
      width:100%;
      padding:10px;
      margin:8px 0;
      border-radius:8px;
      border:none;
      background:#111;
      color:#fff;
    }
  </style>
</head>

<body>

<section class="section">
  <h2>Contact Us</h2>

  <div id="userBox" class="hidden"></div>

  <form id="contactForm" class="hidden">
    <input name="name" placeholder="Your Name" required>
    <input name="email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Message"></textarea>
    <button id="submitBtn">Send Message</button>
  </form>
</section>

<!-- LOGIN POPUP -->
<div id="authModal" class="auth-modal">
  <div class="auth-card">
    <h3>Sign in to Contact</h3>
    <button class="google" onclick="googleLogin()">Google</button>
    <button class="email" onclick="emailLogin()">Email</button>
  </div>
</div>

<script>
/* SAFE FIREBASE INIT */
try{
  const firebaseConfig = {
    apiKey: "AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
    authDomain: "mecknownshop.firebaseapp.com",
    projectId: "mecknownshop"
  };

  firebase.initializeApp(firebaseConfig);
}catch(e){
  console.log("Firebase already initialized");
}

const auth = firebase.auth();

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("authModal").style.display="none";
    document.getElementById("contactForm").classList.remove("hidden");

    document.getElementById("userBox").innerText="👤 "+user.email;
    document.getElementById("userBox").classList.remove("hidden");

    document.querySelector("input[name='email']").value=user.email;
  }
});

/* LOGIN */
function googleLogin(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

function emailLogin(){
  const email=prompt("Email");
  const pass=prompt("Password");
  if(!email||!pass) return;

  auth.signInWithEmailAndPassword(email,pass)
  .catch(()=>auth.createUserWithEmailAndPassword(email,pass));
}

/* SUBMIT FIX */
let sending=false;

document.getElementById("contactForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(sending) return;

  sending=true;
  const btn=document.getElementById("submitBtn");
  btn.innerText="Sending...";
  btn.disabled=true;

  const fd=new FormData(e.target);
  fd.append("sheet","Contact");

  fetch("https://script.google.com/macros/s/AKfycbz4NzPug47y38qVTu9LiDLwp2a9X6J7Iygmq5qQUktEUjyEKp5R7FG5L_0XhMfFApVI/exec",{
    method:"POST",
    body:fd
  })
  .then(()=>alert("Sent"))
  .catch(()=>alert("Error"))
  .finally(()=>{
    sending=false;
    btn.innerText="Send Message";
    btn.disabled=false;
  });
});
</script>

</body>
</html>
