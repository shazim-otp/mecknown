<!DOCTYPE html>
<html lang="en">
<head>

<title>Summer Workshop | Mecknown</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

.container{
  padding:100px 6% 60px;
  max-width:1200px;
  margin:auto;
}

.page-header{
  text-align:center;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
}

iframe{
  width:100%;
  height:180px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

</style>

</head>

<body>
<nav>

    <h1>Mecknown</h1>

    <div class="menu-toggle" id="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <ul id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="ai.html">Meck AI</a></li>
      <li><a href="course.html" class="active">Course</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

  </nav>

<div class="container">

  <div class="page-header">
    <h1>Summer Workshop</h1>
    <p>Recorded workshop classes</p>
  </div>

  <div class="grid" id="videoList"></div>

</div>

<script>

fetch("data/class.json")
.then(res => res.json())
.then(data => {

  const container = document.getElementById("videoList");

  data.classes.forEach(c => {

    container.innerHTML += `
      <div class="card">

        <h3>${c.title}</h3>

        <iframe
          src="https://www.youtube.com/embed/${c.video}"
          loading="lazy"
          allowfullscreen>
        </iframe>

      </div>
    `;

  });

});

</script>
<script>

    const toggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    if(toggle){

      toggle.addEventListener("click", function(){

        navLinks.classList.toggle("active");
        toggle.classList.toggle("active");

      });

    }

  </script>
</body>
</html>
