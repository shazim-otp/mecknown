<!DOCTYPE html>
<html lang="en">
<head>

<title>Summer Workshop | Mecknown</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

.container{
  padding:100px 6% 60px;
  max-width:1200px;
  margin:auto;
}

.page-header{
  text-align:center;
  margin-bottom:30px;
}

.page-header h1{
  font-size:36px;
  margin-bottom:10px;
}

.page-header p{
  color:#9ca3af;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#2a2a2a;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

iframe{
  width:100%;
  height:180px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

/* =========================
   FLOATING CHATBOT
========================= */

.chat-toggle{
  position:fixed;
  bottom:25px;
  right:25px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  cursor:pointer;
  z-index:9999;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.3s;
}

.chat-toggle:hover{
  transform:scale(1.08);
}

.chatbot-box{
  position:fixed;
  bottom:100px;
  right:25px;
  width:340px;
  height:480px;
  background:#0f0f0f;
  border:1px solid #262626;
  border-radius:18px;
  overflow:hidden;
  display:none;
  flex-direction:column;
  z-index:9999;
  box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

.chat-header{
  padding:15px;
  background:#181818;
  border-bottom:1px solid #262626;
  font-weight:600;
}

.chat-messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.bot-message{
  background:#1f2937;
  padding:10px 14px;
  border-radius:12px;
  width:max-content;
  max-width:85%;
  font-size:14px;
  line-height:1.5;
}

.user-message{
  background:#2563eb;
  padding:10px 14px;
  border-radius:12px;
  width:max-content;
  max-width:85%;
  align-self:flex-end;
  font-size:14px;
  line-height:1.5;
}

.chat-input-area{
  display:flex;
  border-top:1px solid #262626;
}

.chat-input-area input{
  flex:1;
  background:#111;
  border:none;
  outline:none;
  padding:14px;
  color:white;
  font-size:14px;
}

.chat-input-area button{
  width:90px;
  border:none;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-weight:600;
}

@media(max-width:768px){

  .chatbot-box{
    width:92%;
    right:4%;
    bottom:90px;
  }

}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav>

  <h1>Mecknown</h1>

  <div class="menu-toggle" id="menu-toggle">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="course.html" class="active">Course</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>

</nav>

<!-- CONTENT -->
<div class="container">

  <div class="page-header">
    <h1>Summer Workshop</h1>
    <p>Recorded workshop classes</p>
  </div>

  <div class="grid" id="videoList"></div>

</div>

<!-- FLOATING CHATBOT -->

<div class="chat-toggle" id="chatToggle">
  💬
</div>

<div class="chatbot-box" id="chatbotBox">

  <div class="chat-header">
    Meck AI Assistant
  </div>

  <div class="chat-messages" id="chatMessages">

    <div class="bot-message">
      Hi 👋<br>
      Ask anything about robotics, AI or the workshop.
    </div>

  </div>

  <div class="chat-input-area">

    <input
      type="text"
      id="chatInput"
      placeholder="Ask something..."
    >

    <button id="sendBtn">
      Send
    </button>

  </div>

</div>

<!-- LOAD VIDEOS -->
<script>

fetch("data/class.json")
.then(res => res.json())
.then(data => {

  const container = document.getElementById("videoList");

  data.classes.forEach(c => {

    container.innerHTML += `
      <div class="card">

        <h3>${c.title}</h3>

        <iframe
          src="https://www.youtube.com/embed/${c.video}"
          loading="lazy"
          allowfullscreen>
        </iframe>

      </div>
    `;

  });

});

</script>

<!-- MENU -->
<script>

const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

if(toggle){

  toggle.addEventListener("click", function(){

    navLinks.classList.toggle("active");
    toggle.classList.toggle("active");

  });

}

</script>

<!-- CHATBOT -->
<script src="chat.js"></script>

</body>
</html>
