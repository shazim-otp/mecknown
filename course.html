<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#0b1f3a;color:#fff;}

.navbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 25px;background:#0a1830;border-bottom:1px solid #1a2d4d;
}
.nav-links a{
  color:#cbd5e1;text-decoration:none;margin-left:20px;
}
.nav-links a:hover{color:#00d4ff;}

.container{padding:25px;max-width:1200px;margin:auto;}

h1{text-align:center;margin-bottom:10px;}
.subtitle{text-align:center;color:#9fb3c8;margin-bottom:25px;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:#0a1830;
  padding:12px;
  border-radius:14px;
  border:1px solid #1a2d4d;
}

iframe{
  width:100%;
  height:180px;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="navbar">
  <div>Mecknown Academy</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="course.html">Course</a>
    <a href="live.html">Live</a>
  </div>
</div>

<div class="container">
<h1>Course Library</h1>
<p class="subtitle">All recorded classes</p>

<div class="grid" id="videoList"></div>
</div>

<script>

fetch("data/class.json")
.then(res => res.json())
.then(data => {

  const container = document.getElementById("videoList");

  data.classes.forEach(c => {
    container.innerHTML += `
      <div class="card">
        <h3>${c.title}</h3>
        <iframe src="https://www.youtube.com/embed/${c.video}?modestbranding=1&rel=0"></iframe>
      </div>
    `;
  });

});

</script>

</body>
</html>
