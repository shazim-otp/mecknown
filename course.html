<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff;}

.navbar{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#111;border-bottom:1px solid #1f1f1f;}
.logo{font-weight:600;}
.nav-links a{color:#fff;text-decoration:none;margin-left:15px;font-size:14px;}
.nav-links a:hover{color:#00ffcc;}

.container{padding:20px;max-width:1100px;margin:auto;}

h1{text-align:center;margin-bottom:20px;}

.section-title{margin:20px 0 10px;font-size:18px;color:#00ffcc;}

.video-box{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#111;}
.video-box iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:10px;}
.card{background:#111;padding:12px;border-radius:12px;}
.card h3{font-size:15px;margin-bottom:8px;}
iframe{width:100%;height:180px;border:none;border-radius:8px;}

.back{display:block;margin:20px auto;width:fit-content;padding:10px 15px;background:#fff;color:#000;border-radius:8px;text-decoration:none;font-weight:600;}
.back:hover{background:#ddd;}

.status{text-align:center;margin-top:10px;color:#aaa;}

</style>
</head>
<body>

<div class="navbar">
  <div class="logo">My Academy</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="course.html">Course</a>
    <a href="live.html">Live Class</a>
  </div>
</div>

<div class="container">

<h1>Student Course</h1>
<a href="index.html" class="back">⬅ Back to Home</a>

<!-- ===== LIVE CLASS ===== -->
<div class="section-title">🔴 Live Class</div>
<div class="video-box" id="liveBox"></div>
<div class="status" id="liveStatus">Checking live class...</div>

<!-- ===== PAST VIDEOS ===== -->
<div class="section-title">📚 Past Classes</div>
<div class="grid" id="videoList"></div>

</div>

<script>

// ===== LIVE CLASS SETTINGS =====
const liveVideoID = "YOUR_LIVE_VIDEO_ID";
const liveStart = new Date("2026-04-01T18:00:00").getTime();

const now = new Date().getTime();
const liveBox = document.getElementById("liveBox");
const liveStatus = document.getElementById("liveStatus");

if(now >= liveStart){
  liveBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${liveVideoID}?modestbranding=1&rel=0"></iframe>`;
  liveStatus.innerText = "Live Now";
}else{
  liveStatus.innerText = "Class not started yet";
}

// ===== PAST VIDEOS (EDIT THIS) =====
const classes = [
  { title: "Introduction", video: "VIDEO_ID_1" },
  { title: "Lesson 2", video: "VIDEO_ID_2" },
  { title: "Lesson 3", video: "VIDEO_ID_3" }
];

const container = document.getElementById("videoList");

classes.forEach(c => {
  container.innerHTML += `
    <div class="card">
      <h3>${c.title}</h3>
      <iframe src="https://www.youtube.com/embed/${c.video}?modestbranding=1&rel=0"></iframe>
    </div>
  `;
});

</script>

</body>
</html>
