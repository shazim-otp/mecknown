<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"><style>
body{margin:0;font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff;}

/* NAVBAR */
.navbar{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background:#0f0f0f;border-bottom:1px solid #1f1f1f;position:sticky;top:0;z-index:10}
.logo{font-weight:600;font-size:18px;letter-spacing:1px}
.nav-links a{color:#ccc;text-decoration:none;margin-left:20px;font-size:14px;transition:.3s}
.nav-links a:hover{color:#00ffcc}

/* CONTAINER */
.container{padding:25px;max-width:1200px;margin:auto}

h1{text-align:center;margin-bottom:10px;font-size:28px}
.subtitle{text-align:center;color:#888;margin-bottom:25px}

.section-title{margin:30px 0 15px;font-size:20px;color:#00ffcc}

/* LIVE BOX */
.live-wrapper{background:linear-gradient(145deg,#111,#0d0d0d);padding:15px;border-radius:16px;box-shadow:0 0 20px rgba(0,0,0,0.6)}
.video-box{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden}
.video-box iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.status{text-align:center;margin-top:10px;color:#aaa}
.live-badge{display:inline-block;background:red;color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;margin-left:10px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}

.card{background:linear-gradient(145deg,#111,#0d0d0d);padding:12px;border-radius:14px;transition:.3s;box-shadow:0 0 10px rgba(0,0,0,0.4)}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,0,0,0.6)}
.card h3{font-size:15px;margin-bottom:8px;color:#eee}
iframe{width:100%;height:180px;border:none;border-radius:10px}

/* BUTTON */
.back{display:block;margin:20px auto;width:fit-content;padding:10px 18px;background:#00ffcc;color:#000;border-radius:8px;text-decoration:none;font-weight:600;transition:.3s}
.back:hover{background:#00ddb3}

/* EMPTY */
.empty{text-align:center;color:#777;margin-top:20px}

@media(max-width:600px){
  h1{font-size:22px}
}

</style></head>
<body><div class="navbar">
  <div class="logo">My Academy</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="course.html">Course</a>
    <a href="live.html">Live</a>
  </div>
</div><div class="container"><h1>Student Dashboard</h1>
<p class="subtitle">Access your live classes and recorded lessons</p><a href="index.html" class="back">⬅ Back to Home</a>

<!-- LIVE --><div class="section-title">🔴 Live Class</div>
<div class="live-wrapper">
  <div class="video-box" id="liveBox"></div>
  <div class="status" id="liveStatus">Checking live class...</div>
</div><!-- PAST --><div class="section-title">📚 Past Classes</div>
<div class="grid" id="videoList"></div>
<div class="empty" id="emptyMsg"></div></div><script>

const classes = JSON.parse(localStorage.getItem("classes") || "[]");
const live = JSON.parse(localStorage.getItem("live") || "{}");

const liveBox = document.getElementById("liveBox");
const liveStatus = document.getElementById("liveStatus");

if(live.id && live.time){
  const now = new Date().getTime();
  const start = new Date(live.time).getTime();

  if(now >= start){
    liveBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${live.id}?modestbranding=1&rel=0"></iframe>`;
    liveStatus.innerHTML = `Live Now <span class="live-badge">LIVE</span>`;
  }else{
    liveStatus.innerText = "Class not started yet";
  }
}else{
  liveStatus.innerText = "No live class scheduled";
}

const container = document.getElementById("videoList");
const emptyMsg = document.getElementById("emptyMsg");

if(classes.length === 0){
  emptyMsg.innerText = "No classes added yet";
}else{
  classes.forEach(c => {
    container.innerHTML += `
      <div class="card">
        <h3>${c.title}</h3>
        <iframe src="https://www.youtube.com/embed/${c.video}?modestbranding=1&rel=0"></iframe>
      </div>
    `;
  });
}

</script></body>
</html>
