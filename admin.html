<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Mecknown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">
</head>
<body>

<section class="section">
  <h2>Admin Login</h2>
  <p>A cleaner admin screen with the same login flow.</p>

  <div class="form-panel" style="max-width:520px;margin:24px auto 0;">
    <form id="loginForm">
      <input type="password" id="adminPass" placeholder="Enter Admin Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</section>

<script>
const ADMIN_PASSWORD = "mecknown2026";

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const entered = document.getElementById("adminPass").value;

  if(entered === ADMIN_PASSWORD){
    localStorage.setItem("adminLoggedIn", "true");
    window.location.href = "dashboard.html";
  }else{
    alert("Incorrect password");
  }
});
</script>

</body>
</html>
