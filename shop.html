<!DOCTYPE html>
<html>
<head>
<title>Mecknown Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
/* (keeping your UI same, no breaking changes) */
.shop-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  padding:20px;
}
.product-card{
  background:#111;
  border:1px solid #1f1f1f;
  border-radius:12px;
  padding:10px;
}
.product-card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}
.price-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}
button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#fff;
  color:#000;
  cursor:pointer;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h1>Mecknown</h1>

  <input type="text" id="searchBar" placeholder="Search products...">

  <div class="menu-toggle" id="menu-toggle">☰</div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="shop.html" class="active">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<section class="hero">
  <h2>⚡ Mecknown Store</h2>
  <p>Smart gadgets • Robotics • Tech builds</p>
</section>

<section class="section">

<!-- LOGIN -->
<div id="loginSection" class="login-box">
  <h2 id="authTitle">Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="emailAuth()" id="authBtn">Login</button>
  <button onclick="googleLogin()">Continue with Google</button>

  <div onclick="toggleAuth()" style="margin-top:10px;color:#aaa;cursor:pointer;">
    Don't have an account? Sign up
  </div>

  <p id="authError" style="color:red;font-size:13px;"></p>
</div>

<!-- SHOP -->
<div id="shopSection" style="display:none;">
  <div class="shop-header">
    <p id="userInfo"></p>

    <button id="addProductBtn" onclick="addProduct()" style="display:none;">
      + Add Product
    </button>

    <button onclick="logout()">Logout</button>
  </div>

  <div class="shop-grid" id="productContainer"></div>
</div>

</section>

<script>

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
  authDomain: "mecknownshop.firebaseapp.com",
  projectId: "mecknownshop"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "shazamotp@gmail.com";

/* AUTH MODE */
let isLogin = true;

function toggleAuth(){
  isLogin = !isLogin;
  document.getElementById("authTitle").innerText = isLogin ? "Login" : "Sign Up";
  document.getElementById("authBtn").innerText = isLogin ? "Login" : "Create Account";
}

/* EMAIL LOGIN */
function emailAuth(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("authError");

  errorBox.innerText = "";

  if(isLogin){
    auth.signInWithEmailAndPassword(email,password)
    .catch(err => errorBox.innerText = err.message);
  } else {
    auth.createUserWithEmailAndPassword(email,password)
    .catch(err => errorBox.innerText = err.message);
  }
}

/* GOOGLE LOGIN */
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* AUTH STATE */
auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("loginSection").style.display="none";
    document.getElementById("shopSection").style.display="block";
    document.getElementById("userInfo").innerText="👤 "+user.email;

    if(user.email === ADMIN_EMAIL){
      document.getElementById("addProductBtn").style.display = "inline-block";
    }

    loadProducts();
  }
});

/* LOGOUT */
function logout(){
  auth.signOut();
  location.reload();
}

/* LOAD PRODUCTS */
function loadProducts(){
  const container = document.getElementById("productContainer");

  db.collection("products")
    .orderBy("createdAt","desc")
    .onSnapshot(snapshot=>{
      container.innerHTML="";

      snapshot.forEach(doc=>{
        const product = doc.data();

        const card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
          <img src="${product.image}">
          <h3>${product.name}</h3>
          <p>${product.description}</p>
          <div class="price-row">
            <span>₹${product.price}</span>
            <button>Buy</button>
          </div>
        `;

        card.querySelector("button").onclick = () => {
          placeOrder(product.name, product.price);
        };

        container.appendChild(card);
      });
    });
}

/* 🔥 CLOUDINARY ADD PRODUCT */
function addProduct(){
  const user = auth.currentUser;

  if(!user || user.email !== ADMIN_EMAIL){
    alert("Access denied");
    return;
  }

  const name = prompt("Product name:");
  const price = prompt("Price:");
  const description = prompt("Description:");

  if(!name || !price) return;

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "image/*";
  fileInput.click();

  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "mecknown_upload");

    try{
      const res = await fetch("https://api.cloudinary.com/v1_1/do8z7aoj4/image/upload",{
        method:"POST",
        body:formData
      });

      const data = await res.json();

      db.collection("products").add({
        name,
        price,
        description,
        image: data.secure_url,
        createdAt: new Date()
      });

      alert("✅ Product Added!");

    }catch(err){
      console.error(err);
      alert("Upload failed");
    }
  };
}

/* ORDER */
function placeOrder(name, price){
  const user=auth.currentUser;

  const formData=new FormData();
  formData.append("email", user.email);
  formData.append("product", name);
  formData.append("price", price);

  fetch("https://script.google.com/macros/s/AKfycbwYlsLWQZkH3iGed2VA3hWk63gw8mn559sI-iLNR-uzD6UXXlLkirN2DkJMdVLzoniMPA/exec",{
    method:"POST",
    body:formData
  })
  .then(()=>alert("Order placed!"))
  .catch(()=>alert("Order failed"));
}

/* SEARCH */
document.getElementById("searchBar").addEventListener("input", function(){
  const value=this.value.toLowerCase();
  const cards=document.querySelectorAll(".product-card");

  cards.forEach(card=>{
    const text=card.innerText.toLowerCase();
    card.style.display = text.includes(value) ? "" : "none";
  });
});

/* MOBILE MENU */
document.getElementById("menu-toggle").addEventListener("click",()=>{
  document.getElementById("nav-links").classList.toggle("active");
});

</script>

</body>
</html>
