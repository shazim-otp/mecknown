<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Shop Arduino, sensors, and robotics components at affordable prices. Fast ordering via WhatsApp.">
<meta name="keywords" content="Arduino, robotics, sensors, electronics shop, buy Arduino India">
<meta name="author" content="Mecknown">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico">

<style>

/* ===== NAVBAR FIX ===== */
nav{
  justify-content:space-between !important;
  padding:18px 6% !important;
}

.cart-icon{
  position:relative !important;
}

.menu-toggle{
  position:relative !important;
}

/* ===== OVERLAY FIX ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(3px);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:2000;
}
.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* ===== CART PANEL ===== */
.cart-panel{
  position:fixed;
  top:0;
  left:-100%;
  width:300px;
  height:100%;
  background:#111;
  padding:20px;
  transition:0.3s;
  z-index:4000;
}
.cart-panel.active{
  left:0;
}

/* ===== CHECKOUT BUTTON ===== */
.checkout-btn{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  background:linear-gradient(135deg,#ff5a7a,#ff8fa3);
  color:#000;
}

/* ===== PERFORMANCE ===== */
.hero-img,.card{
  will-change:transform;
  transform:translateZ(0);
}

</style>

</head>

<body class="shop-page">

<!-- NAVBAR -->
<nav>
  <div class="cart-icon" onclick="toggleCart()">
    🛒<span class="cart-count" id="cartCount">0</span>
  </div>

  <h1>Mecknown</h1>

  <div class="menu-toggle" id="menu-toggle">
    <span></span><span></span><span></span>
  </div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="course.html">Course</a></li>
    <li><a href="shop.html" class="active">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- HERO -->
<section class="hero">
  <div class="hero-row">
    <img src="assets/arduinoq.png" class="hero-img" id="arduinoHero">
    <img src="assets/esp32.png" class="hero-img" id="espHero">
    <img src="assets/stm32.png" class="hero-img" id="stmHero">
  </div>

  <h1 id="heroText">Mecknown Robotics Store</h1>
  <p id="heroSub">Build • Learn • Innovate with Electronics</p>
</section>

<!-- CART -->
<div class="cart-panel" id="cartPanel">

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>Your Cart</h3>
    <button onclick="toggleCart()" style="background:none;border:none;font-size:20px;color:white;cursor:pointer;">✕</button>
  </div>

  <div id="cartItems"></div>
  <div class="total" id="total">Total: 0</div>

  <button class="checkout-btn" onclick="openAddressPopup()">Checkout</button>

</div>

<!-- PRODUCTS -->
<section class="products" id="products"></section>

<!-- ADDRESS POPUP -->
<div class="address-popup" id="addressPopup">
  <div class="address-box">
    <h3>Checkout</h3>
    <input id="nameInput" placeholder="Name">
    <input id="phoneInput" type="tel" placeholder="Phone">
    <input id="addressInput" placeholder="Address">
    <div class="error" id="errorMsg"></div>
    <button onclick="submitOrder()">Confirm</button>
    <button onclick="closeAddressPopup()" style="background:#fff">Cancel</button>
  </div>
</div>

<!-- SUCCESS -->
<div class="success" id="successBox">
  <div class="success-box"><h2>Order Placed ✅</h2></div>
</div>

<script>

/* ===== DATA ===== */
let products=[];
let cart=JSON.parse(localStorage.getItem('cart'))||[];

/* ===== ELEMENTS ===== */
const toggle=document.getElementById('menu-toggle');
const navLinks=document.getElementById('nav-links');
const cartPanel=document.getElementById('cartPanel');
const overlay=document.getElementById('overlay');

const cartItems=document.getElementById('cartItems');
const cartCount=document.getElementById('cartCount');
const totalDiv=document.getElementById('total');

/* ===== FORMAT ₹ ===== */
function formatPrice(num){
  return "₹"+Number(num).toLocaleString('en-IN');
}

/* ===== MENU ===== */
toggle.addEventListener("click",()=>{
  const isOpen = navLinks.classList.toggle("active");
  cartPanel.classList.remove('active');
  overlay.classList.toggle("active", isOpen);
});

/* ===== CART ===== */
function toggleCart(){
  const isOpen = cartPanel.classList.toggle('active');
  navLinks.classList.remove('active');
  overlay.classList.toggle('active', isOpen);
}

/* ===== OVERLAY CLOSE ===== */
overlay.addEventListener('click',()=>{
  cartPanel.classList.remove('active');
  navLinks.classList.remove('active');
  overlay.classList.remove('active');
});

/* ===== CART LOGIC ===== */
function updateCart(){
  cartItems.innerHTML='';
  let total=0;

  cart.forEach((i,index)=>{
    total+=i.price*i.qty;

    cartItems.innerHTML+=`
      <div>
        ${i.name} x${i.qty}
        <div>
          <button onclick='changeQty(${index},-1)'>-</button>
          ${i.qty}
          <button onclick='changeQty(${index},1)'>+</button>
        </div>
        <div>${formatPrice(i.price*i.qty)}</div>
      </div>`;
  });

  totalDiv.textContent='Total: '+formatPrice(total);
  cartCount.textContent=cart.length;
}

function addToCart(name,priceStr){
  const price=parseFloat(priceStr.replace(/[^0-9.]/g,''))||0;
  const ex=cart.find(i=>i.name===name);
  if(ex) ex.qty++;
  else cart.push({name,price,qty:1});
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCart();
}

function changeQty(i,val){
  cart[i].qty+=val;
  if(cart[i].qty<=0) cart.splice(i,1);
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCart();
}

/* ===== POPUP ===== */
function openAddressPopup(){
  if(cart.length===0) return alert('Cart empty');
  document.getElementById('addressPopup').style.display='flex';
  cartPanel.classList.remove('active');
  overlay.classList.remove('active');
}

function closeAddressPopup(){
  document.getElementById('addressPopup').style.display='none';
}

/* ===== WHATSAPP ORDER AUTO SEND ===== */
function submitOrder(){
  const name=nameInput.value.trim();
  const phone=phoneInput.value.trim();
  const address=addressInput.value.trim();

  if(!name||!phone||!address){
    errorMsg.textContent='Fill all fields';
    return;
  }

  const orderId='ORD-'+Date.now();

  let msg=`🛒 Mecknown Order%0A`;
  msg+=`🆔 ${orderId}%0A`;
  msg+=`👤 ${name}%0A📞 ${phone}%0A📍 ${address}%0A%0A`;

  let total=0;

  cart.forEach(i=>{
    const itemTotal=i.price*i.qty;
    total+=itemTotal;
    msg+=`${i.name} x${i.qty} - ₹${itemTotal}%0A`;
  });

  msg+=`%0ATotal: ₹${total}`;

  window.open(`https://wa.me/919048585461?text=${msg}`);

  document.getElementById('successBox').style.display='flex';

  setTimeout(()=>{
    document.getElementById('successBox').style.display='none';
    cart=[];
    localStorage.setItem('cart','[]');
    updateCart();
    closeAddressPopup();
  },2000);
}

updateCart();

/* ===== LOAD PRODUCTS ===== */
async function load(){
  const res=await fetch('data/products.json');
  products=await res.json();

  const c=document.getElementById('products');
  c.innerHTML='';

  products.forEach(p=>{
    c.innerHTML+=`
      <div class='card'>
        <img src='${p.img}'>
        <h3>${p.name}</h3>
        <p>${formatPrice(p.price)}</p>
        <button class="add-btn" onclick="addToCart('${p.name}','${p.price}')">Add to Cart</button>
      </div>`;
  });
}

load();

</script>

</body>
</html>
