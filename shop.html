<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    html{scroll-behavior:smooth;}

    body{
      background:radial-gradient(circle at top,#0f172a,#020617);
      color:#fff;overflow-x:hidden;
    }

    header{text-align:center;padding:100px 20px 40px;position:relative;z-index:1;}

    header::before{content:"";position:absolute;width:300px;height:300px;background:#00ffcc33;filter:blur(120px);top:0;left:50%;transform:translateX(-50%);z-index:0;}

    .arduino-intro{width:240px;margin:auto;transform:translateY(-180px);opacity:0;animation:slideDown 1s ease forwards;position:relative;z-index:1;}
    .arduino-intro img{width:100%;animation:float 4s ease-in-out infinite;}

    @keyframes slideDown{to{transform:translateY(0);opacity:1;}}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

    .title-main{font-size:34px;font-weight:600;margin-top:30px;position:relative;}
    .subtitle{color:#94a3b8;margin-top:10px;}

    .search-box{max-width:500px;margin:30px auto 0;}
    .search-box input{width:100%;padding:14px 18px;border-radius:12px;border:none;outline:none;background:rgba(255,255,255,0.08);color:#fff;backdrop-filter:blur(10px);}

    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px;padding:50px;max-width:1300px;margin:auto;}

    .card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:16px;transition:0.3s;cursor:pointer;}
    .card:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,0.6);}

    .card img{width:100%;border-radius:12px;}
    .title{font-size:18px;margin:12px 0 6px;}
    .price{color:#22c55e;margin-bottom:12px;font-weight:600;}

    .popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:0.3s;z-index:9999;}
    .popup.active{opacity:1;pointer-events:auto;}

    .popup-content{background:rgba(20,20,20,0.8);backdrop-filter:blur(20px);padding:25px;border-radius:16px;max-width:400px;width:90%;transform:scale(0.8);transition:0.3s;}
    .popup.active .popup-content{transform:scale(1);}

    .popup img{width:100%;border-radius:12px;margin-bottom:15px;}

    .close-btn,.cart-btn{margin-top:12px;padding:10px;border-radius:8px;text-align:center;cursor:pointer;font-weight:600;}
    .close-btn{background:#fff;color:#000;}
    .cart-btn{background:linear-gradient(90deg,#00ffcc,#22c55e);color:#000;}
  </style>
</head>
<body>

<header>
  <div class="arduino-intro" id="arduino">
    <img src="assets/arduinoq.png">
  </div>
  <div class="title-main">Mecknown E-Comp  Store</div>
  <div class="subtitle">Build. Hack. Create.</div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search products...">
  </div>
</header>

<section class="products" id="products"></section>

<div class="popup" id="popup">
  <div class="popup-content" id="popupContent"></div>
</div>

<script>
let products = [];
let cart = [];

const container = document.getElementById("products");
const searchInput = document.getElementById("search");
const popup = document.getElementById("popup");
const popupContent = document.getElementById("popupContent");

// 🔥 LOAD FROM GITHUB JSON
async function loadProducts(){
  const res = await fetch('data/products.json');
  products = await res.json();
  renderProducts(products);
}

function renderProducts(list){
  container.innerHTML = "";
  list.forEach((p,i)=>{
    container.innerHTML += `
      <div class="card" onclick="openPopup(${i})">
        <img src="${p.img}">
        <div class="title">${p.name}</div>
        <div class="price">${p.price}</div>
      </div>
    `;
  });
}

function openPopup(i){
  const p = products[i];
  popupContent.innerHTML = `
    <img src="${p.img}">
    <h2>${p.name}</h2>
    <p>${p.desc}</p>
    <div class="price">${p.price}</div>
    <div class="cart-btn" onclick="addToCart('${p.name}')">Add to Cart</div>
    <div class="close-btn" onclick="closePopup()">Close</div>
  `;
  popup.classList.add('active');
}

function closePopup(){popup.classList.remove('active');}

function addToCart(name){
  cart.push(name);
  alert(name+" added to cart");
}

popup.addEventListener('click',(e)=>{if(e.target===popup)closePopup();});

searchInput.addEventListener('input',()=>{
  const val = searchInput.value.toLowerCase();
  const filtered = products.filter(p=>p.name.toLowerCase().includes(val));
  renderProducts(filtered);
});

// parallax
const arduino = document.getElementById('arduino');
window.addEventListener('scroll',()=>{
  arduino.style.transform = `translateY(${window.scrollY*0.4}px)`;
});

loadProducts();
</script>

</body>
</html>
