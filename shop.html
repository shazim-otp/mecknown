<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:radial-gradient(circle at top,#0f172a,#020617);color:#fff}

.navbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:rgba(10,10,10,0.7);backdrop-filter:blur(12px);z-index:1000}
.logo{font-weight:600}
.nav-links{display:flex;gap:20px;list-style:none}
.nav-links a{color:#94a3b8;text-decoration:none}

.cart-icon{cursor:pointer;position:relative}
.cart-count{position:absolute;top:-8px;right:-8px;background:#22c55e;color:#000;font-size:12px;padding:2px 6px;border-radius:50%}

.cart-panel{position:fixed;top:0;right:-350px;width:300px;height:100%;background:#111;padding:20px;transition:0.3s;z-index:2000;overflow-y:auto}
.cart-panel.active{right:0}
.cart-item{margin-bottom:10px;border-bottom:1px solid #333;padding-bottom:8px}

.qty{
  display:flex;gap:8px;align-items:center;margin-top:5px
}
.qty button{padding:2px 8px}

.total{margin-top:15px;font-weight:600}
.checkout{margin-top:10px;padding:10px;background:#22c55e;color:#000;text-align:center;border-radius:8px;cursor:pointer}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:40px}
.card{background:#111;padding:15px;border-radius:10px;cursor:pointer;position:relative}

.wishlist-btn{position:absolute;top:10px;right:10px;cursor:pointer}

/* SUMMARY MODAL */
.summary{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  display:none;align-items:center;justify-content:center;z-index:3000
}
.summary-box{background:#111;padding:20px;border-radius:10px;width:300px}

</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">Mecknown</div>
  <ul class="nav-links"><li><a href="shop.html">Shop</a></li></ul>

  <div class="cart-icon" onclick="toggleCart()">
    🛒
    <span class="cart-count" id="cartCount">0</span>
  </div>
</nav>

<div class="cart-panel" id="cartPanel">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <div class="total" id="total">Total: 0</div>
  <div class="checkout" onclick="checkout()">Checkout</div>
  <div class="checkout" onclick="openSummary()" style="margin-top:5px;background:#fff;color:#000">View Summary</div>
</div>

<section class="products" id="products"></section>

<!-- SUMMARY -->
<div class="summary" id="summary">
  <div class="summary-box" id="summaryBox"></div>
</div>

<script>
let products = [];
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

const container = document.getElementById('products');
const cartPanel = document.getElementById('cartPanel');
const cartItemsDiv = document.getElementById('cartItems');
const cartCount = document.getElementById('cartCount');
const totalDiv = document.getElementById('total');

function toggleCart(){cartPanel.classList.toggle('active');}

function getPrice(p){
  return parseFloat(p.replace(/[^0-9.]/g,'')) || 0;
}

function updateCartUI(){
  cartItemsDiv.innerHTML='';
  let total = 0;

  cart.forEach((item,i)=>{
    total += item.price * item.qty;

    cartItemsDiv.innerHTML += `
      <div class="cart-item">
        ${item.name}
        <div class="qty">
          <button onclick="changeQty(${i},-1)">-</button>
          ${item.qty}
          <button onclick="changeQty(${i},1)">+</button>
          <button onclick="removeCart(${i})">x</button>
        </div>
      </div>`;
  });

  totalDiv.textContent = 'Total: ' + total;
  cartCount.textContent = cart.length;
}

function addToCart(name,priceStr){
  const price = getPrice(priceStr);

  const existing = cart.find(i=>i.name===name);
  if(existing){existing.qty++;}
  else{cart.push({name,price,qty:1});}

  localStorage.setItem('cart',JSON.stringify(cart));
  updateCartUI();
}

function changeQty(i,val){
  cart[i].qty += val;
  if(cart[i].qty<=0) cart.splice(i,1);
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCartUI();
}

function removeCart(i){
  cart.splice(i,1);
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCartUI();
}

function checkout(){
  let msg = 'Order:%0A';
  cart.forEach(i=>{
    msg += `${i.name} x${i.qty} = ${i.price*i.qty}%0A`;
  });

  window.open(`https://wa.me/?text=${msg}`);
}

function openSummary(){
  const box = document.getElementById('summaryBox');
  let html = '<h3>Order Summary</h3>';

  cart.forEach(i=>{
    html += `<p>${i.name} x${i.qty}</p>`;
  });

  box.innerHTML = html + '<br><button onclick="closeSummary()">Close</button>';
  document.getElementById('summary').style.display='flex';
}

function closeSummary(){document.getElementById('summary').style.display='none';}

async function loadProducts(){
  const res = await fetch('data/products.json');
  products = await res.json();
  renderProducts(products);
}

function renderProducts(list){
  container.innerHTML='';
  list.forEach((p)=>{
    const liked = wishlist.includes(p.name);

    container.innerHTML += `
      <div class="card">
        <div class="wishlist-btn" onclick="toggleWishlist(event,'${p.name}')">${liked?'❤️':'🤍'}</div>
        <img src="${p.img}" style="width:100%">
        <h3>${p.name}</h3>
        <p>${p.price}</p>
        <button onclick="addToCart('${p.name}','${p.price}')">Add</button>
      </div>`;
  });
}

function toggleWishlist(e,name){
  e.stopPropagation();
  if(wishlist.includes(name)) wishlist = wishlist.filter(n=>n!==name);
  else wishlist.push(name);
  localStorage.setItem('wishlist',JSON.stringify(wishlist));
  renderProducts(products);
}

updateCartUI();
loadProducts();
</script>

</body>
</html>
