<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>

<link rel="stylesheet" href="style.css">

<style>

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(3px);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:2000;
}
.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* ===== CART FIX ===== */
.cart-panel{
  position:fixed;
  top:0;
  left:-100%;
  width:300px;
  height:100%;
  background:#111;
  padding:20px;
  transition:0.3s ease;
  z-index:4000;
  overflow-y:auto;
}
.cart-panel.active{
  left:0;
}

/* ===== CHECKOUT POPUP FIX ===== */
.address-popup{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:5000;
}

.address-popup.active{
  display:flex;
}

/* CENTER BOX */
.address-box{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:90%;
  max-width:350px;
  text-align:center;
}

/* ===== SUCCESS FIX ===== */
.success{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:6000;
}
.success.active{
  display:flex;
}

</style>
</head>

<body class="shop-page">

<nav>
  <div onclick="toggleCart()">🛒<span id="cartCount">0</span></div>
  <h1>Mecknown</h1>
</nav>

<div class="overlay" id="overlay"></div>

<!-- CART -->
<div class="cart-panel" id="cartPanel">
  <div style="display:flex;justify-content:space-between;">
    <h3>Cart</h3>
    <button onclick="toggleCart()">✕</button>
  </div>

  <div id="cartItems"></div>
  <div id="total">Total: 0</div>

  <button onclick="openAddressPopup()">Checkout</button>
</div>

<!-- PRODUCTS -->
<section id="products"></section>

<!-- ADDRESS POPUP -->
<div class="address-popup" id="addressPopup">
  <div class="address-box">
    <h3>Checkout</h3>
    <input id="nameInput" placeholder="Name"><br><br>
    <input id="phoneInput" placeholder="Phone"><br><br>
    <input id="addressInput" placeholder="Address"><br><br>
    <div id="errorMsg"></div>
    <button onclick="submitOrder()">Confirm</button>
    <button onclick="closeAddressPopup()">Cancel</button>
  </div>
</div>

<!-- SUCCESS -->
<div class="success" id="successBox">
  <div style="background:#111;padding:20px;border-radius:10px;">
    <h2>Order Placed ✅</h2>
  </div>
</div>

<script>

let cart=[];

const cartPanel=document.getElementById('cartPanel');
const overlay=document.getElementById('overlay');

/* CART */
function toggleCart(){
  const open = cartPanel.classList.toggle('active');
  overlay.classList.toggle('active',open);
}

/* OVERLAY CLICK */
overlay.onclick=()=>{
  cartPanel.classList.remove('active');
  overlay.classList.remove('active');
}

/* CART UPDATE */
function updateCart(){
  const items=document.getElementById('cartItems');
  const total=document.getElementById('total');

  let t=0;
  items.innerHTML='';

  cart.forEach(i=>{
    t+=i.price;
    items.innerHTML+=`<div>${i.name} - ₹${i.price}</div>`;
  });

  total.innerText="Total: ₹"+t;
  document.getElementById('cartCount').innerText=cart.length;
}

/* ADD */
function addToCart(name,price){
  cart.push({name,price});
  updateCart();
}

/* POPUP */
function openAddressPopup(){
  if(cart.length===0) return alert("Cart empty");

  document.getElementById('addressPopup').classList.add('active');

  cartPanel.classList.remove('active');
  overlay.classList.remove('active');
}

function closeAddressPopup(){
  document.getElementById('addressPopup').classList.remove('active');
}

/* ORDER */
function submitOrder(){
  const name=nameInput.value;
  const phone=phoneInput.value;
  const address=addressInput.value;

  if(!name||!phone||!address){
    errorMsg.innerText="Fill all fields";
    return;
  }

  let msg=`Order:%0A${name}%0A${phone}%0A${address}%0A`;

  cart.forEach(i=>{
    msg+=`${i.name} - ₹${i.price}%0A`;
  });

  window.open(`https://wa.me/919048585461?text=${msg}`);

  document.getElementById('successBox').classList.add('active');

  setTimeout(()=>{
    document.getElementById('successBox').classList.remove('active');
    cart=[];
    updateCart();
    closeAddressPopup();
  },2000);
}

</script>

</body>
</html>
