<script>

/* ===== DATA ===== */
let products=[];
let cart=JSON.parse(localStorage.getItem('cart'))||[];

/* ===== ELEMENTS ===== */
const toggle=document.getElementById('menu-toggle');
const navLinks=document.getElementById('nav-links');
const cartPanel=document.getElementById('cartPanel');
const overlay=document.getElementById('overlay');

const cartItems=document.getElementById('cartItems');
const cartCount=document.getElementById('cartCount');
const totalDiv=document.getElementById('total');

/* ===== FORMAT ₹ ===== */
function formatPrice(num){
return "₹"+Number(num).toLocaleString('en-IN');
}

/* ===== HERO ANIMATION (OPTIMIZED) ===== */
window.addEventListener("load",()=>{
requestAnimationFrame(()=>{
setTimeout(()=>arduinoHero.classList.add("show"),200);
setTimeout(()=>espHero.classList.add("show"),500);
setTimeout(()=>stmHero.classList.add("show"),800);
setTimeout(()=>heroText.classList.add("show"),1200);
setTimeout(()=>heroSub.classList.add("show"),1500);
});
});

/* ===== MENU ===== */
toggle.addEventListener("click",()=>{
const isOpen = navLinks.classList.toggle("active");
cartPanel.classList.remove('active');
overlay.classList.toggle("active", isOpen);
document.body.classList.toggle("menu-open", isOpen);
});

/* ===== CART ===== */
function toggleCart(){
const isOpen = cartPanel.classList.toggle('active');
navLinks.classList.remove('active');
overlay.classList.toggle('active', isOpen);
document.body.classList.toggle("cart-open", isOpen);
 
}

/* ===== OVERLAY CLOSE ===== */
overlay.addEventListener('click',()=>{
cartPanel.classList.remove('active');
navLinks.classList.remove('active');
overlay.classList.remove('active');
  document.body.classList.remove("cart-open","menu-open");
  document.body.classList.remove("cart-open");
});

/* ===== CART LOGIC ===== */
function updateCart(){
cartItems.innerHTML='';
let total=0;

cart.forEach((i,index)=>{
total+=i.price*i.qty;

cartItems.innerHTML+=`
     <div>
       ${i.name} x${i.qty}
       <div class='qty'>
         <button onclick='changeQty(${index},-1)'>-</button>
         ${i.qty}
         <button onclick='changeQty(${index},1)'>+</button>
       </div>
       <div>${formatPrice(i.price*i.qty)}</div>
     </div>`;
});

totalDiv.textContent='Total: '+formatPrice(total);
cartCount.textContent = cart.reduce((sum,i)=>sum+i.qty,0);
}

function addToCart(name,priceStr){
const price=parseFloat(priceStr.replace(/[^0-9.]/g,''))||0;
const ex=cart.find(i=>i.name===name);
if(ex) ex.qty++;
else cart.push({name,price,qty:1});
localStorage.setItem('cart',JSON.stringify(cart));
updateCart();
}

function changeQty(i,val){
cart[i].qty+=val;
if(cart[i].qty<=0) cart.splice(i,1);
localStorage.setItem('cart',JSON.stringify(cart));
updateCart();
}

/* ===== POPUP ===== */
function openAddressPopup(){
if(cart.length===0) return alert('Cart empty');

const popup = document.getElementById('addressPopup');
popup.classList.add('active');

cartPanel.classList.remove('active');
overlay.classList.remove('active');
document.body.classList.remove("cart-open");
}

function closeAddressPopup(){
document.getElementById('addressPopup').classList.remove('active');
}

/* ===== WHATSAPP ORDER ===== */
function submitOrder(){
const name=nameInput.value;
const phone=phoneInput.value;
const address=addressInput.value;

if(!name||!phone||!address){
errorMsg.textContent='Fill all fields';
return;
}

const orderId='ORD-'+Date.now();

let msg=`Order ID:${orderId}%0AName:${name}%0APhone:${phone}%0AAddress:${address}%0A`;
cart.forEach(i=>msg+=`${i.name} x${i.qty} - ₹${i.price*i.qty}%0A`);

window.open(`https://wa.me/918129991353?text=${msg}`);

document.getElementById('successBox').style.display='flex';

setTimeout(()=>{
document.getElementById('successBox').style.display='none';
cart=[];
localStorage.setItem('cart','[]');
updateCart();
},2000);
}

updateCart();

/* ===== LOAD PRODUCTS (OPTIMIZED) ===== */
const SUPABASE_URL = "https://jlluaxbraqoyumgkfxyt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsbHVheGJyYXFveXVtZ2tmeHl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MDA5OTgsImV4cCI6MjA5MTM3Njk5OH0.z2i1oL-VVNyBu3SSY5nr2lJ5Zh7GE3hIOzMHHSTAxUw";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function load(){
  const { data, error } = await supabaseClient.from('products').select('*');

  if(error){
    console.error(error);
    return;
  }

  products = data;

  const c=document.getElementById('products');
  c.innerHTML='';

  products.forEach(p=>{
    c.innerHTML+=`
      <div class='card'>
        <img src='${p.img}' loading="lazy">
        <h3>${p.name}</h3>
        <p>${formatPrice(p.price)}</p>
        <button class="add-btn" onclick="addToCart('${p.name}','${p.price}')">Add to Cart</button>
      </div>`;
  });
}

load();

/* ===== SHOP PAGE SPARKLES CANVAS ===== */
(function() {
  const canvas = document.createElement('canvas');
  canvas.className = 'page-bg-canvas';
  canvas.id = 'shop-canvas';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  
  const particles = [];
  
  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });
  
  class Sparkle {
    constructor() {
      this.reset();
      this.y = Math.random() * height;
    }
    
    reset() {
      this.x = Math.random() * width;
      this.y = height + Math.random() * 20;
      this.size = Math.random() * 1.5 + 0.5;
      this.speedY = -(Math.random() * 0.4 + 0.1);
      this.opacity = Math.random() * 0.3 + 0.1;
      this.fade = Math.random() * 0.002 + 0.001;
    }
    
    update() {
      this.y += this.speedY;
      this.opacity -= this.fade;
      
      if (this.y < 0 || this.opacity <= 0) {
        this.reset();
      }
    }
    
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
      ctx.fill();
    }
  }
  
  const particleCount = Math.min(50, Math.floor(width / 30));
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Sparkle());
  }
  
  function animate() {
    ctx.clearRect(0, 0, width, height);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }
  animate();
})();

</script>
