<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:radial-gradient(circle at top,#0f172a,#020617);color:#fff}

.navbar{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:rgba(10,10,10,0.7);
  backdrop-filter:blur(12px);
  z-index:1000;
}

.nav-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.nav-links{
  position:fixed;
  top:0;
  right:-260px;
  width:250px;
  height:100%;
  background:#020617;
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:80px 20px;
  list-style:none;
  transition:0.3s;
  z-index:1500;
}

.nav-links.open{
  right:0;
}

.nav-links a{
  color:#94a3b8;
  text-decoration:none;
  font-size:14px;
  transition:0.3s;
}

.nav-links a:hover{
  color:#fff;
}

.hamburger{
  display:none;
  flex-direction:column;
  gap:4px;
  cursor:pointer;
}

.hamburger span{
  width:22px;
  height:3px;
  background:#fff;
}



  .nav-links.active{
    transform:translateY(0);
  }

  .hamburger{
    display:flex;
  }
}
.logo{font-weight:600}

.cart-icon{cursor:pointer;position:relative}
.cart-count{position:absolute;top:-8px;right:-8px;background:#22c55e;color:#000;font-size:12px;padding:2px 6px;border-radius:50%}

.cart-panel{position:fixed;top:0;right:-350px;width:300px;height:100%;background:#111;padding:20px;transition:0.3s;z-index:2000;overflow-y:auto}
.cart-panel.active{right:0}
.cart-item{margin-bottom:10px;border-bottom:1px solid #333;padding-bottom:8px}

.qty{display:flex;gap:8px;align-items:center;margin-top:5px}
.qty button{padding:2px 8px}

.total{margin-top:15px;font-weight:600}
.checkout{margin-top:10px;padding:10px;background:#22c55e;color:#000;text-align:center;border-radius:8px;cursor:pointer}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:40px}
.card{background:#111;padding:15px;border-radius:10px;cursor:pointer}

/* ADDRESS POPUP */
.address-popup{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:3000}
.address-box{background:#111;padding:20px;border-radius:10px;width:320px}

.address-box input{
  width:100%;padding:10px;margin-top:10px;border:none;border-radius:8px
}

.address-box button{
  margin-top:10px;width:100%;padding:10px;border:none;border-radius:8px;
  background:#22c55e;color:#000;font-weight:600;cursor:pointer
}

.error{color:#ef4444;font-size:13px;margin-top:5px}

/* SUCCESS */
.success{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  display:none;align-items:center;justify-content:center;z-index:4000
}
.success-box{
  background:#111;padding:30px;border-radius:12px;text-align:center
}

</style></head>
<body><nav class="navbar">
  <div class="nav-left">
    </nav><div class="cart-panel" id="cartPanel">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <div class="total" id="total">Total: 0</div>
  <div class="checkout" onclick="openAddressPopup()">Checkout</div>
</div><section class="products" id="products"></section><!-- ADDRESS POPUP --><div class="address-popup" id="addressPopup">
  <div class="address-box">
    <h3>Checkout Details</h3><input type="text" id="nameInput" placeholder="Your name">
<input type="text" id="phoneInput" placeholder="Phone number">
<input type="text" id="addressInput" placeholder="Address">

<div class="error" id="errorMsg"></div>

<button onclick="submitOrder()">Confirm Order</button>
<button onclick="closeAddressPopup()" style="background:#fff;margin-top:5px">Cancel</button>

  </div>
</div><!-- SUCCESS --><div class="success" id="successBox">
  <div class="success-box">
    <h2>Order Placed ✅</h2>
    <p>Your order has been sent</p>
  </div>
</div><script>
let products = [];
let cart = JSON.parse(localStorage.getItem('cart')) || [];

const container = document.getElementById('products');
const cartPanel = document.getElementById('cartPanel');
const cartItemsDiv = document.getElementById('cartItems');
const cartCount = document.getElementById('cartCount');
const totalDiv = document.getElementById('total');

// MOBILE NAV
const hamburger = document.getElementById('hamburger');
const navLinks = document.getElementById('navLinks');

hamburger.addEventListener('click',()=>{
  navLinks.classList.toggle('open');
});

function toggleCart(){cartPanel.classList.toggle('active');}

function updateCartUI(){
  cartItemsDiv.innerHTML='';
  let total = 0;

  cart.forEach((item,i)=>{
    total += item.price * item.qty;

    cartItemsDiv.innerHTML += `
      <div class="cart-item">
        ${item.name}
        <div class="qty">
          <button onclick="changeQty(${i},-1)">-</button>
          ${item.qty}
          <button onclick="changeQty(${i},1)">+</button>
          <button onclick="removeCart(${i})">x</button>
        </div>
      </div>`;
  });

  totalDiv.textContent = 'Total: ' + total;
  cartCount.textContent = cart.length;
}

function addToCart(name,priceStr){
  const price = parseFloat(priceStr.replace(/[^0-9.]/g,'')) || 0;

  const existing = cart.find(i=>i.name===name);
  if(existing){existing.qty++;}
  else{cart.push({name,price,qty:1});}

  localStorage.setItem('cart',JSON.stringify(cart));
  updateCartUI();
}

function changeQty(i,val){
  cart[i].qty += val;
  if(cart[i].qty<=0) cart.splice(i,1);
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCartUI();
}

function removeCart(i){
  cart.splice(i,1);
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCartUI();
}

function generateOrderID(){
  return 'ORD-' + Date.now();
}

function openAddressPopup(){
  if(cart.length===0) return alert('Cart is empty');

  // autofill
  document.getElementById('nameInput').value = localStorage.getItem('user_name') || '';
  document.getElementById('phoneInput').value = localStorage.getItem('user_phone') || '';
  document.getElementById('addressInput').value = localStorage.getItem('user_address') || '';

  document.getElementById('addressPopup').style.display='flex';
}

function closeAddressPopup(){
  document.getElementById('addressPopup').style.display='none';
}

function submitOrder(){
  const name = document.getElementById('nameInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const address = document.getElementById('addressInput').value.trim();
  const error = document.getElementById('errorMsg');

  if(!name || !phone || !address){
    error.textContent = 'All fields are required';
    return;
  }

  if(phone.length < 8){
    error.textContent = 'Enter valid phone number';
    return;
  }

  error.textContent = '';

  // save for autofill
  localStorage.setItem('user_name',name);
  localStorage.setItem('user_phone',phone);
  localStorage.setItem('user_address',address);

  const orderId = generateOrderID();

  let msg = `Order ID: ${orderId}%0AName: ${name}%0APhone: ${phone}%0AAddress: ${address}%0A%0A`;

  cart.forEach(i=>{
    msg += `${i.name} x${i.qty} = ${i.price*i.qty}%0A`;
  });

  window.open(`https://wa.me/?text=${msg}`);

  closeAddressPopup();

  // success animation
  const success = document.getElementById('successBox');
  success.style.display = 'flex';

  setTimeout(()=>{
    success.style.display = 'none';
    cart = [];
    localStorage.setItem('cart',JSON.stringify(cart));
    updateCartUI();
  },2000);
}

async function loadProducts(){
  const res = await fetch('data/products.json');
  products = await res.json();
  renderProducts(products);
}

function renderProducts(list){
  container.innerHTML='';
  list.forEach((p)=>{
    container.innerHTML += `
      <div class="card">
        <img src="${p.img}" style="width:100%">
        <h3>${p.name}</h3>
        <p>${p.price}</p>
        <button onclick="addToCart('${p.name}','${p.price}')">Add</button>
      </div>`;
  });
}

updateCartUI();
loadProducts();
</script></body>
</html>
