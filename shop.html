<!DOCTYPE html>
<html>
<head>
<title>Mecknown Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

/* ===== NAVBAR FIX ===== */
.navbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 20px;
  background:rgba(10,10,10,0.8);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f1f;
  position:sticky;
  top:0;
  z-index:1000;
}

/* LOGO */
.navbar h1{
  font-size:20px;
  font-weight:700;
  background:linear-gradient(45deg,#fff,#888);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:1px;
}

/* SEARCH CENTER */
.navbar input{
  flex:1;
  max-width:400px;
  margin:0 20px;
  padding:10px;
  border-radius:10px;
  border:1px solid #222;
  background:#111;
  color:#fff;
}

/* NAV LINKS RIGHT */
#nav-links{
  display:flex;
  gap:16px;
  list-style:none;
}

#nav-links a{
  color:#ccc;
  text-decoration:none;
  font-size:14px;
  transition:0.2s;
}

#nav-links a:hover,
#nav-links .active{
  color:#fff;
}

/* MOBILE MENU */
.menu-toggle{
  display:none;
  flex-direction:column;
  cursor:pointer;
}

.menu-toggle span{
  width:25px;
  height:3px;
  background:#fff;
  margin:4px 0;
}

/* HERO */
.hero{
  text-align:center;
  padding:40px 20px;
}

.hero h2{
  font-size:28px;
  margin-bottom:10px;
}

/* SHOP */
.shop-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
  padding:20px;
}

.product-card{
  background:#111;
  border:1px solid #1f1f1f;
  border-radius:16px;
  padding:14px;
  transition:0.3s;
}

.product-card:hover{
  transform:translateY(-6px) scale(1.01);
}

.product-card img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:12px;
}

.price-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

button{
  border:none;
  padding:8px 12px;
  border-radius:8px;
  background:#fff;
  color:#000;
  font-weight:600;
  cursor:pointer;
}

/* LOGIN */
.login-box{
  max-width:350px;
  margin:40px auto;
  padding:20px;
  background:#111;
  border-radius:16px;
  border:1px solid #222;
}

/* ===== MOBILE FIX ===== */
@media(max-width:768px){

  .navbar{
    flex-wrap:wrap;
  }

  .navbar input{
    order:3;
    width:100%;
    margin:10px 0;
  }

  .menu-toggle{
    display:flex;
  }

  #nav-links{
    position:absolute;
    top:60px;
    right:0;
    background:#111;
    flex-direction:column;
    width:200px;
    display:none;
    padding:10px;
  }

  #nav-links.active{
    display:flex;
  }
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h1>Mecknown</h1>

  <input type="text" id="searchBar" placeholder="Search products...">

  <div class="menu-toggle" id="menu-toggle">
    <span></span><span></span><span></span>
  </div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="shop.html" class="active">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero">
  <h2>Mecknown Store</h2>
  <p>Smart gadgets • Robotics • Tech builds</p>
</section>

</body>
</html>
