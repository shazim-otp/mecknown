<!DOCTYPE html>
<html>
<head>
<title>Mecknown Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:#0a0a0a;
  border-bottom:1px solid #1f1f1f;
}

.navbar h1{
  font-size:20px;
}

.navbar input{
  width:40%;
  padding:8px;
  border-radius:8px;
  border:1px solid #222;
  background:#111;
  color:#fff;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:15px;
}

#nav-links{
  display:flex;
  gap:15px;
  list-style:none;
}

#nav-links a{
  color:#ccc;
  text-decoration:none;
}

#nav-links a.active{
  color:#fff;
}

.menu-toggle{
  display:none;
  font-size:22px;
  cursor:pointer;
}

@media(max-width:768px){
  .navbar input{ display:none; }

  .menu-toggle{ display:block; }

  #nav-links{
    display:none;
    flex-direction:column;
    position:absolute;
    right:0;
    top:60px;
    background:#111;
    padding:10px;
  }

  #nav-links.active{
    display:flex;
  }
}

/* LOGIN */
.login-box{
  max-width:350px;
  margin:40px auto;
  padding:20px;
  background:#111;
  border:1px solid #222;
  border-radius:14px;
  text-align:center;
}

.login-box input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #333;
  background:#0a0a0a;
  color:#fff;
}

.login-box button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#fff;
  color:#000;
}

/* SHOP */
.shop-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  padding:20px;
}

.product-card{
  background:#111;
  border:1px solid #1f1f1f;
  border-radius:12px;
  padding:10px;
}

.product-card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

.price-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

button{
  cursor:pointer;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h1>Mecknown</h1>

  <input type="text" id="searchBar" placeholder="Search products...">

  <div class="nav-right">
    <ul id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="ai.html">Meck AI</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="menu-toggle" id="menu-toggle">☰</div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h2>Mecknown Store</h2>
  <p>Smart gadgets • Robotics • Tech builds</p>
</section>

<!-- LOGIN -->
<div id="loginSection" class="login-box">
  <h2 id="authTitle">Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="emailAuth()" id="authBtn">Login</button>
  <button onclick="googleLogin()">Continue with Google</button>

  <div onclick="toggleAuth()" style="margin-top:10px;color:#aaa;cursor:pointer;">
    Switch to Sign Up
  </div>

  <p id="authError" style="color:red;font-size:13px;"></p>
</div>

<!-- SHOP -->
<div id="shopSection" style="display:none;">
  <div style="padding:20px;">
    <p id="userInfo"></p>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="shop-grid" id="productContainer"></div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
  authDomain: "mecknownshop.firebaseapp.com",
  projectId: "mecknownshop"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* AUTH */
let isLogin = true;

function toggleAuth(){
  isLogin = !isLogin;
  document.getElementById("authTitle").innerText = isLogin ? "Login" : "Sign Up";
}

/* LOGIN */
function emailAuth(){
  const emailVal = document.getElementById("email").value;
  const passwordVal = document.getElementById("password").value;
  const err = document.getElementById("authError");

  err.innerText = "";

  if(isLogin){
    auth.signInWithEmailAndPassword(emailVal,passwordVal)
      .catch(e => err.innerText = e.message);
  }else{
    auth.createUserWithEmailAndPassword(emailVal,passwordVal)
      .catch(e => err.innerText = e.message);
  }
}

function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginSection").style.display="none";
    document.getElementById("shopSection").style.display="block";
    document.getElementById("userInfo").innerText="👤 "+user.email;

    loadProducts();
  }
});

/* LOGOUT */
function logout(){
  auth.signOut();
  location.reload();
}

/* LOAD PRODUCTS */
function loadProducts(){
  const container = document.getElementById("productContainer");

  db.collection("products").orderBy("createdAt","desc")
  .onSnapshot(snap=>{
    container.innerHTML="";

    snap.forEach(doc=>{
      const p = doc.data();

      container.innerHTML += `
      <div class="product-card">
        <img src="${p.image}">
        <h3>${p.name}</h3>
        <p>${p.description}</p>
        <div class="price-row">
          <span>₹${p.price}</span>
          <button onclick="placeOrder('${p.name}','${p.price}')">Buy</button>
        </div>
      </div>`;
    });
  });
}

/* ✅ UPDATED ORDER SYSTEM */
function placeOrder(name,price){
  const user = auth.currentUser;

  const phone = prompt("Enter your phone number:");
  if(!phone) return;

  const fd = new FormData();
  fd.append("email",user.email);
  fd.append("product",name);
  fd.append("price",price);
  fd.append("phone",phone);
  fd.append("time",new Date().toLocaleString());

  fetch("https://script.google.com/macros/s/AKfycbwYlsLWQZkH3iGed2VA3hWk63gw8mn559sI-iLNR-uzD6UXXlLkirN2DkJMdVLzoniMPA/exec",
  {method:"POST",body:fd})
  .then(()=>alert("Order placed!"))
  .catch(()=>alert("Order failed"));
}

/* SEARCH */
document.getElementById("searchBar").addEventListener("input", function(){
  const v=this.value.toLowerCase();
  document.querySelectorAll(".product-card").forEach(c=>{
    c.style.display=c.innerText.toLowerCase().includes(v)?"":"none";
  });
});

/* MENU */
document.getElementById("menu-toggle").addEventListener("click", function(){
  document.getElementById("nav-links").classList.toggle("active");
});

</script>

</body>
</html>
