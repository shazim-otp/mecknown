<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Shop Arduino, sensors, and robotics components at affordable prices. Fast ordering via WhatsApp.">
<meta name="keywords" content="Arduino, robotics, sensors, electronics shop, buy Arduino India">
<meta name="author" content="Mecknown">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

/* ===== BACKGROUND (ENHANCED) ===== */
body{
  background:
    radial-gradient(circle at 20% 20%, rgba(255,90,122,0.08), transparent 40%),
    radial-gradient(circle at top,#0f172a,#020617);
  color:#fff
}

/* ===== NAVBAR ===== */
nav{
  position:sticky;
  top:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px 20px;
  background:rgba(10,10,10,0.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,90,122,0.2);
  z-index:3000;
}
nav h1{font-size:18px}

/* ===== HERO ===== */
.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:90vh;
  text-align:center;
  gap:20px;
  perspective:1000px;
}

.hero-row{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}

.hero-img{
  width:220px;
  max-width:30vw;
  transform:translateY(-120px);
  opacity:0;
  transition:transform 0.2s ease;
}

.hero-img.show{
  opacity:1;
  animation:dropBounce 1s ease forwards, glow 2s infinite alternate;
}

.hero-img:hover{
  transform:scale(1.05) rotateX(8deg) rotateY(-8deg);
}

@keyframes glow{
  from{filter:drop-shadow(0 0 5px #ff5a7a)}
  to{filter:drop-shadow(0 0 20px #ff5a7a)}
}

/* ===== BUTTON ===== */
.add-btn{
  margin-top:10px;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  color:#000;
  background:linear-gradient(135deg,#ff5a7a,#ff8fa3);
  box-shadow:0 4px 15px rgba(255,90,122,0.3);
  transition:all 0.25s ease;
}

.add-btn:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 8px 25px rgba(255,90,122,0.6);
}

/* ===== CART ===== */
.cart-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);cursor:pointer}
.cart-count{
  position:absolute;
  top:-8px;
  right:-8px;
  background:#ff5a7a;
  color:#000;
  font-size:12px;
  padding:2px 6px;
  border-radius:50%;
}

/* ===== MENU ===== */
.menu-toggle{position:absolute;right:15px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.menu-toggle span{width:22px;height:3px;background:#fff}

/* ===== SIDE MENU ===== */
#nav-links{
  position:fixed;top:0;right:-260px;width:260px;height:100vh;
  background:#020617;display:flex;flex-direction:column;
  gap:20px;padding:100px 20px 20px;list-style:none;
  transition:0.3s;z-index:3000;
  border-left:1px solid rgba(255,90,122,0.2);
}
#nav-links.active{right:0}
#nav-links a{color:#94a3b8;text-decoration:none}

/* ===== CART PANEL ===== */
.cart-panel{
  position:fixed;top:0;left:-320px;width:300px;height:100%;
  background:linear-gradient(145deg,#111,#0a0a0a);
  padding:20px;transition:0.3s;
  z-index:3000;overflow-y:auto;
  border-right:1px solid rgba(255,90,122,0.2);
}
.cart-panel.active{left:0}

/* ===== PRODUCTS ===== */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:40px;
}

/* ===== CARD (UPGRADED) ===== */
.card{
  position:relative;
  background:linear-gradient(145deg,rgba(255,90,122,0.12),rgba(10,10,10,0.7));
  border:1px solid rgba(255,90,122,0.2);
  padding:15px;
  border-radius:14px;
  backdrop-filter:blur(12px);
  transition:0.35s ease;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(120deg, transparent, rgba(255,90,122,0.6), transparent);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  pointer-events:none;
  opacity:0.5;
}

.card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:#ff5a7a;
  box-shadow:
    0 20px 40px rgba(0,0,0,0.7),
    0 0 25px rgba(255,90,122,0.4);
}

.card img{
  width:100%;
  border-radius:10px;
  transition:0.4s;
}
.card:hover img{transform:scale(1.05)}

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:none;z-index:2000;
  backdrop-filter:blur(4px);
}
.overlay.active{display:block}

/* ===== POPUP ===== */
.address-box{
  background:linear-gradient(145deg,#111,#0a0a0a);
  border:1px solid rgba(255,90,122,0.2);
}

/* ===== CHECKOUT ===== */
.checkout{
  margin-top:10px;
  padding:10px;
  background:linear-gradient(135deg,#ff5a7a,#ff8fa3);
  color:#000;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  box-shadow:0 0 15px rgba(255,90,122,0.4);
}

/* ===== SUCCESS ===== */
.success-box{
  background:linear-gradient(145deg,#111,#0a0a0a);
  border:1px solid rgba(255,90,122,0.2);
}

/* ===== SCROLL ===== */
::-webkit-scrollbar-thumb{
  background:linear-gradient(#222,#ff5a7a);
}
</style>
</head>

<body>

<!-- EVERYTHING BELOW EXACTLY SAME (UNCHANGED LOGIC) -->

<nav>
  <div class="cart-icon" onclick="toggleCart()">🛒<span class="cart-count" id="cartCount">0</span></div>
  <h1>Mecknown</h1>
  <div class="menu-toggle" id="menu-toggle">
    <span></span><span></span><span></span>
  </div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="course.html">Course</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<div class="overlay" id="overlay"></div>

<section class="hero">
  <div class="hero-row">
    <img src="assets/arduinoq.png" class="hero-img" id="arduinoHero">
    <img src="assets/esp32.png" class="hero-img" id="espHero">
    <img src="assets/stm32.png" class="hero-img" id="stmHero">
  </div>

  <h1 id="heroText">Mecknown Robotics Store</h1>
  <p id="heroSub">Build • Learn • Innovate with Electronics</p>
</section>

<div class="cart-panel" id="cartPanel">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <div class="total" id="total">Total: 0</div>
  <div class="checkout" onclick="openAddressPopup()">Checkout</div>
</div>

<section class="products" id="products"></section>

<div class="address-popup" id="addressPopup">
  <div class="address-box">
    <h3>Checkout</h3>
    <input id="nameInput" placeholder="Name">
    <input id="phoneInput" placeholder="Phone">
    <input id="addressInput" placeholder="Address">
    <div class="error" id="errorMsg"></div>
    <button onclick="submitOrder()">Confirm</button>
    <button onclick="closeAddressPopup()" style="background:#fff">Cancel</button>
  </div>
</div>

<div class="success" id="successBox">
  <div class="success-box"><h2>Order Placed ✅</h2></div>
</div>

<script>
/* YOUR FULL ORIGINAL JS (UNCHANGED) */
let products=[];
let cart=JSON.parse(localStorage.getItem('cart'))||[];
const toggle=document.getElementById('menu-toggle');
const navLinks=document.getElementById('nav-links');
const cartPanel=document.getElementById('cartPanel');
const overlay=document.getElementById('overlay');
const cartItems=document.getElementById('cartItems');
const cartCount=document.getElementById('cartCount');
const totalDiv=document.getElementById('total');

function formatPrice(num){return "₹"+Number(num).toLocaleString('en-IN');}

window.addEventListener("load",()=>{
  setTimeout(()=>arduinoHero.classList.add("show"),200);
  setTimeout(()=>espHero.classList.add("show"),500);
  setTimeout(()=>stmHero.classList.add("show"),800);
  setTimeout(()=>heroText.classList.add("show"),1200);
  setTimeout(()=>heroSub.classList.add("show"),1500);
  setTimeout(()=>{document.getElementById("products").scrollIntoView({behavior:"smooth"});},3000);
});

toggle.addEventListener("click",()=>{
  const isOpen = navLinks.classList.toggle("active");
  cartPanel.classList.remove('active');
  overlay.classList.toggle("active", isOpen);
  document.body.classList.toggle("menu-open", isOpen);
});

function toggleCart(){
  const isOpen = cartPanel.classList.toggle('active');
  navLinks.classList.remove('active');
  overlay.classList.toggle('active', isOpen);
  document.body.classList.toggle("cart-open", isOpen);
}

overlay.addEventListener('click',()=>{
  cartPanel.classList.remove('active');
  navLinks.classList.remove('active');
  overlay.classList.remove('active');
  document.body.classList.remove("cart-open","menu-open");
});

function updateCart(){
  cartItems.innerHTML='';
  let total=0;
  cart.forEach((i,index)=>{
    total+=i.price*i.qty;
    cartItems.innerHTML+=`
      <div>
        ${i.name} x${i.qty}
        <div class='qty'>
          <button onclick='changeQty(${index},-1)'>-</button>
          ${i.qty}
          <button onclick='changeQty(${index},1)'>+</button>
        </div>
        <div>${formatPrice(i.price*i.qty)}</div>
      </div>`;
  });
  totalDiv.textContent='Total: '+formatPrice(total);
  cartCount.textContent=cart.length;
}

function addToCart(name,priceStr){
  const price=parseFloat(priceStr.replace(/[^0-9.]/g,''))||0;
  const ex=cart.find(i=>i.name===name);
  if(ex) ex.qty++; else cart.push({name,price,qty:1});
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCart();
}

function changeQty(i,val){
  cart[i].qty+=val;
  if(cart[i].qty<=0) cart.splice(i,1);
  localStorage.setItem('cart',JSON.stringify(cart));
  updateCart();
}

function openAddressPopup(){
  if(cart.length===0) return alert('Cart empty');
  document.getElementById('addressPopup').style.display='flex';
  cartPanel.classList.remove('active');
  overlay.classList.remove('active');
  document.body.classList.remove("cart-open");
}

function closeAddressPopup(){
  document.getElementById('addressPopup').style.display='none';
}

function submitOrder(){
  const name=nameInput.value;
  const phone=phoneInput.value;
  const address=addressInput.value;

  if(!name||!phone||!address){
    errorMsg.textContent='Fill all fields';
    return;
  }

  const orderId='ORD-'+Date.now();
  let msg=`Order ID:${orderId}%0AName:${name}%0APhone:${phone}%0AAddress:${address}%0A`;
  cart.forEach(i=>msg+=`${i.name} x${i.qty} - ₹${i.price*i.qty}%0A`);

  window.open(`https://wa.me/919048585461?text=${msg}`);

  document.getElementById('successBox').style.display='flex';

  setTimeout(()=>{
    document.getElementById('successBox').style.display='none';
    cart=[];
    localStorage.setItem('cart','[]');
    updateCart();
  },2000);
}

updateCart();

async function load(){
  const res=await fetch('data/products.json');
  products=await res.json();

  const c=document.getElementById('products');
  c.innerHTML='';

  products.forEach(p=>{
    c.innerHTML+=`
      <div class='card'>
        <img src='${p.img}'>
        <h3>${p.name}</h3>
        <p>${formatPrice(p.price)}</p>
        <button class="add-btn" onclick="addToCart('${p.name}','${p.price}')">Add to Cart</button>
      </div>`;
  });
}

load();
</script>

</body>
</html>
