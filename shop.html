<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Shop Arduino, sensors, and robotics components at affordable prices. Fast ordering via WhatsApp.">
<meta name="keywords" content="Arduino, robotics, sensors, electronics shop, buy Arduino India">
<meta name="author" content="Mecknown">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

/* ===== BACKGROUND (UPGRADED) ===== */
body{
  background:
    radial-gradient(circle at 20% 20%, rgba(255,90,122,0.08), transparent 40%),
    radial-gradient(circle at top,#0f172a,#020617);
  color:#fff
}

/* ===== NAVBAR ===== */
nav{
  position:sticky;
  top:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px 20px;
  background:rgba(10,10,10,0.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,90,122,0.2);
  z-index:3000;
}
nav h1{font-size:18px}

/* ===== HERO ===== */
.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:90vh;
  text-align:center;
  gap:20px;
  perspective:1000px;
}

.hero-row{
  display:flex;
  gap:20px;
  justify-content:center;
  flex-wrap:wrap;
}

.hero-img{
  width:220px;
  max-width:30vw;
  transform:translateY(-120px);
  opacity:0;
  transition:transform 0.2s ease;
}

.hero-img.show{
  opacity:1;
  animation:dropBounce 1s ease forwards, glow 2s infinite alternate;
}

.hero-img:hover{
  transform:scale(1.05) rotateX(8deg) rotateY(-8deg);
}

.hero h1{
  font-size:30px;
  opacity:0;
  transform:translateY(30px);
  transition:0.6s ease;
}
.hero h1.show{
  opacity:1;
  transform:translateY(0);
}

.hero p{
  font-size:14px;
  color:#94a3b8;
  opacity:0;
  transform:translateY(20px);
  transition:0.6s ease;
}
.hero p.show{
  opacity:1;
  transform:translateY(0);
}

@keyframes dropBounce{
  0%{opacity:0;transform:translateY(-120px)}
  60%{opacity:1;transform:translateY(10px)}
  80%{transform:translateY(-5px)}
  100%{transform:translateY(0)}
}

@keyframes glow{
  from{filter:drop-shadow(0 0 5px #ff5a7a)}
  to{filter:drop-shadow(0 0 20px #ff5a7a)}
}

/* ===== BUTTON ===== */
.add-btn{
  margin-top:10px;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  color:#000;
  background:linear-gradient(135deg,#ff5a7a,#ff8fa3);
  box-shadow:0 4px 15px rgba(255,90,122,0.3);
  transition:all 0.25s ease;
}

.add-btn:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 8px 25px rgba(255,90,122,0.6);
}

/* ===== CART ===== */
.cart-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}
.cart-count{
  position:absolute;
  top:-8px;
  right:-8px;
  background:#ff5a7a;
  color:#000;
  font-size:12px;
  padding:2px 6px;
  border-radius:50%;
}

/* ===== MENU ===== */
.menu-toggle{
  position:absolute;
  right:15px;
  display:flex;
  flex-direction:column;
  gap:4px;
  cursor:pointer;
}
.menu-toggle span{
  width:22px;
  height:3px;
  background:#fff;
}

/* ===== SIDE MENU ===== */
#nav-links{
  position:fixed;
  top:0;
  right:-260px;
  width:260px;
  height:100vh;
  background:#020617;
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:100px 20px 20px;
  list-style:none;
  transition:0.3s;
  z-index:3000;
  border-left:1px solid rgba(255,90,122,0.2);
}
#nav-links.active{right:0}
#nav-links a{color:#94a3b8;text-decoration:none}

/* ===== CART PANEL ===== */
.cart-panel{
  position:fixed;
  top:0;
  left:-320px;
  width:300px;
  height:100%;
  background:linear-gradient(145deg,#111,#0a0a0a);
  padding:20px;
  transition:0.3s;
  z-index:3000;
  overflow-y:auto;
  border-right:1px solid rgba(255,90,122,0.2);
}
.cart-panel.active{left:0}

/* ===== PRODUCTS ===== */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:40px;
}

/* ===== CARD (UPGRADED) ===== */
.card{
  position:relative;
  background:linear-gradient(145deg,rgba(255,90,122,0.12),rgba(10,10,10,0.7));
  border:1px solid rgba(255,90,122,0.2);
  padding:15px;
  border-radius:14px;
  backdrop-filter:blur(12px);
  transition:0.35s ease;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(120deg, transparent, rgba(255,90,122,0.6), transparent);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  pointer-events:none;
  opacity:0.5;
}

.card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:#ff5a7a;
  box-shadow:
    0 20px 40px rgba(0,0,0,0.7),
    0 0 25px rgba(255,90,122,0.4);
}

.card img{
  width:100%;
  border-radius:10px;
  transition:0.4s;
}
.card:hover img{transform:scale(1.05)}

/* ===== OVERLAY ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:2000;
  backdrop-filter:blur(4px);
}
.overlay.active{display:block}

/* ===== POPUP ===== */
.address-box{
  background:linear-gradient(145deg,#111,#0a0a0a);
  border:1px solid rgba(255,90,122,0.2);
}

/* ===== CHECKOUT ===== */
.checkout{
  margin-top:10px;
  padding:10px;
  background:linear-gradient(135deg,#ff5a7a,#ff8fa3);
  color:#000;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  box-shadow:0 0 15px rgba(255,90,122,0.4);
}

/* ===== SUCCESS ===== */
.success-box{
  background:linear-gradient(145deg,#111,#0a0a0a);
  border:1px solid rgba(255,90,122,0.2);
}

/* ===== SCROLL ===== */
::-webkit-scrollbar-thumb{
  background:linear-gradient(#222,#ff5a7a);
}

</style>
</head>
