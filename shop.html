<!DOCTYPE html>
<html>
<head>
<title>Mecknown Shop</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="hologram">MECKNOWN</div>
</div>

<!-- NAVBAR -->
<nav>
  <h1>Mecknown</h1>

  <div class="menu-toggle" id="menu-toggle">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- SHOP -->
<section class="section">
  <h2>Mecknown Store</h2>

  <div id="loginSection">
    <button onclick="googleLogin()">Sign in with Google</button>
  </div>

  <div id="shopSection" style="display:none;">
    <p id="userInfo"></p>
    <div class="shop-grid" id="productContainer"></div>
    <button onclick="logout()">Logout</button>
  </div>
</section>

<footer>
© 2026 Mecknown.
</footer>

<script>

/* LOADER */
window.onload = function(){
  const loader = document.getElementById("loader");
  if(loader){
    loader.style.display = "none";
  }
};

/* MOBILE MENU */
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

if(toggle && navLinks){
  toggle.addEventListener("click", function(){
    navLinks.classList.toggle("active");
    toggle.classList.toggle("active");
  });
}

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
  authDomain: "mecknownshop.firebaseapp.com",
  projectId: "mecknownshop"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* LOGIN */
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* AUTH STATE */
auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("loginSection").style.display="none";
    document.getElementById("shopSection").style.display="block";
    document.getElementById("userInfo").innerText = "Logged in as: " + user.email;
    loadProducts();
  }
});

/* LOGOUT */
function logout(){
  auth.signOut();
  location.reload();
}

/* LOAD PRODUCTS */
function loadProducts(){
  fetch("products.json")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("productContainer");
    container.innerHTML = "";

    data.forEach(product => {
      container.innerHTML += `
        <div class="product-card">
          <img src="${product.image}">
          <h3>${product.name}</h3>
          <p>${product.description}</p>
          <div class="price">₹${product.price}</div>
          <button class="buy-btn" onclick="placeOrder('${product.name}', '${product.price}')">
            Buy Now
          </button>
        </div>
      `;
    });
  });
}

/* ORDER */
function placeOrder(name, price){
  const user = auth.currentUser;

  const formData = new FormData();
  formData.append("email", user.email);
  formData.append("product", name);
  formData.append("price", price);

  fetch("https://script.google.com/macros/s/AKfycbwYlsLWQZkH3iGed2VA3hWk63gw8mn559sI-iLNR-uzD6UXXlLkirN2DkJMdVLzoniMPA/exec", {
    method: "POST",
    body: formData
  })
  .then(() => alert("Order placed!"))
  .catch(() => alert("Order failed"));
}

</script>

</body>
</html>
