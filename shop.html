<!DOCTYPE html>
<html>
<head>
<title>Mecknown Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

/* ✅ NAVBAR FIX (RIGHT SIDE CLEAN) */
.navbar{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:12px 20px;
  background:#0a0a0a;
  border-bottom:1px solid #1f1f1f;
}

/* LOGO LEFT */
.navbar h1{
  margin-right:auto;
  font-size:20px;
}

/* SEARCH CENTER-RIGHT */
.navbar input{
  margin-right:20px;
  padding:8px;
  border-radius:8px;
  border:1px solid #222;
  background:#111;
  color:#fff;
}

/* NAV LINKS RIGHT */
#nav-links{
  display:flex;
  gap:15px;
  list-style:none;
  margin-left:auto;
}

#nav-links a{
  color:#ccc;
  text-decoration:none;
}

#nav-links a.active{
  color:#fff;
}

/* MOBILE */
.menu-toggle{
  display:none;
}

@media(max-width:768px){
  .menu-toggle{ display:block; }

  #nav-links{
    display:none;
    flex-direction:column;
    background:#111;
    position:absolute;
    right:0;
    top:60px;
    padding:10px;
  }

  #nav-links.active{
    display:flex;
  }

  .navbar input{
    width:100%;
    margin:10px 0;
  }
}

/* SHOP GRID */
.shop-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  padding:20px;
}

.product-card{
  background:#111;
  border:1px solid #1f1f1f;
  border-radius:12px;
  padding:10px;
}

.product-card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

.price-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#fff;
  color:#000;
  cursor:pointer;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h1>Mecknown</h1>

  <input type="text" id="searchBar" placeholder="Search products...">

  <div class="menu-toggle" id="menu-toggle">☰</div>

  <ul id="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="ai.html">Meck AI</a></li>
    <li><a href="shop.html" class="active">Shop</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- HERO -->
<section class="hero">
  <h2>Mecknown Store</h2>
  <p>Smart gadgets • Robotics • Tech builds</p>
</section>

<section class="section">

<!-- LOGIN -->
<div id="loginSection" class="login-box">
  <button onclick="googleLogin()">Sign in with Google</button>
</div>

<!-- SHOP -->
<div id="shopSection" style="display:none;">
  <div class="shop-header">
    <p id="userInfo"></p>

    <button id="addProductBtn" onclick="addProduct()" style="display:none;">
      + Add Product
    </button>

    <button onclick="logout()">Logout</button>
  </div>

  <div class="shop-grid" id="productContainer"></div>
</div>

</section>

<script>

/* FIREBASE CONFIG (UNCHANGED) */
const firebaseConfig = {
  apiKey: "AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
  authDomain: "mecknownshop.firebaseapp.com",
  projectId: "mecknownshop"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "shazamotp@gmail.com";

/* LOGIN */
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* AUTH STATE */
auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("loginSection").style.display="none";
    document.getElementById("shopSection").style.display="block";
    document.getElementById("userInfo").innerText="👤 "+user.email;

    if(user.email === ADMIN_EMAIL){
      document.getElementById("addProductBtn").style.display="inline-block";
    }

    loadProducts();
  }
});

/* LOGOUT */
function logout(){
  auth.signOut();
  location.reload();
}

/* LOAD PRODUCTS */
function loadProducts(){
  const container = document.getElementById("productContainer");

  db.collection("products")
    .orderBy("createdAt","desc")
    .onSnapshot(snapshot=>{
      container.innerHTML="";

      snapshot.forEach(doc=>{
        const product = doc.data();

        const card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
          <img src="${product.image}">
          <h3>${product.name}</h3>
          <p>${product.description}</p>
          <div class="price-row">
            <span>₹${product.price}</span>
            <button>Buy</button>
          </div>
        `;

        card.querySelector("button").onclick = () => {
          placeOrder(product.name, product.price);
        };

        container.appendChild(card);
      });
    });
}

/* ADD PRODUCT */
function addProduct(){
  const user = auth.currentUser;

  if(!user || user.email !== ADMIN_EMAIL){
    alert("Access denied");
    return;
  }

  const name = prompt("Product name:");
  const price = prompt("Price:");
  const image = prompt("Image URL:");
  const description = prompt("Description:");

  if(!name || !price) return;

  db.collection("products").add({
    name,
    price,
    image,
    description,
    createdAt: new Date()
  })
  .then(()=>alert("✅ Product Added!"));
}

/* ORDER */
function placeOrder(name, price){
  const user=auth.currentUser;

  const formData=new FormData();
  formData.append("email", user.email);
  formData.append("product", name);
  formData.append("price", price);

  fetch("https://script.google.com/macros/s/AKfycbwYlsLWQZkH3iGed2VA3hWk63gw8mn559sI-iLNR-uzD6UXXlLkirN2DkJMdVLzoniMPA/exec",{
    method:"POST",
    body:formData
  })
  .then(()=>alert("Order placed!"))
  .catch(()=>alert("Order failed"));
}

/* SEARCH */
document.getElementById("searchBar").addEventListener("input", function(){
  const value=this.value.toLowerCase();
  const cards=document.querySelectorAll(".product-card");

  cards.forEach(card=>{
    const text=card.innerText.toLowerCase();
    card.style.display = text.includes(value) ? "" : "none";
  });
});

/* MOBILE MENU */
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

if(toggle && navLinks){
  toggle.addEventListener("click", function(){
    navLinks.classList.toggle("active");
  });
}

</script>

</body>
</html>
