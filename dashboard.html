<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MECK Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0f172a;color:#fff;padding:20px}
.container{max-width:1000px;margin:auto}
h1{margin-bottom:20px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}
input,textarea,button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:8px}
input,textarea{background:#0f172a;color:#fff}
button{background:#38bdf8;color:#000;font-weight:600;cursor:pointer}
button:hover{opacity:.8}
.list{margin-top:20px}
.item{background:#0f172a;padding:10px;border-radius:8px;margin-bottom:10px}
</style>
</head>

<body>
<div class="container">
<h1>Admin Panel (Supabase)</h1>

<!-- PRODUCT SECTION -->
<div class="card">
<h2>Add Product</h2>
<input type="text" id="pName" placeholder="Product Name">
<input type="number" id="pPrice" placeholder="Price">
<input type="text" id="pImg" placeholder="Image URL">
<textarea id="pDesc" placeholder="Description"></textarea>
<button onclick="addProduct()">Add Product</button>

<div class="list" id="productList"></div>
</div>

<!-- PROJECT SECTION -->
<div class="card">
<h2>Add Project</h2>
<input type="text" id="prName" placeholder="Project Title">
<input type="text" id="prImg" placeholder="Image URL">
<textarea id="prDesc" placeholder="Description"></textarea>
<button onclick="addProject()">Add Project</button>

<div class="list" id="projectList"></div>
</div>

</div>

<script>
console.log("Admin JS Loaded");

// ✅ YOUR SUPABASE KEYS
const SUPABASE_URL = "https://jlluaxbraqoyumgkfxyt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsbHVheGJyYXFveXVtZ2tmeHl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MDA5OTgsImV4cCI6MjA5MTM3Njk5OH0.z2i1oL-VVNyBu3SSY5nr2lJ5Zh7GE3hIOzMHHSTAxUw";

// ✅ FIXED NAME (no conflict)
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// LOAD DATA
async function loadData(){
  const { data: products } = await supabaseClient.from('products').select('*');
  const { data: projects } = await supabaseClient.from('projects').select('*');

  renderProducts(products || []);
  renderProjects(projects || []);
}

// ADD PRODUCT
async function addProduct(){
  const name = document.getElementById('pName').value;
  const price = document.getElementById('pPrice').value;
  const img = document.getElementById('pImg').value;
  const description = document.getElementById('pDesc').value;

  if(!name || !price) return alert("Fill required fields");

  const { error } = await supabaseClient.from('products').insert([
    { name, price, img, description }
  ]);

  if(error){
    alert(error.message);
    console.error(error);
    return;
  }

  alert("Product added ✅");

  // clear inputs
  document.getElementById('pName').value = "";
  document.getElementById('pPrice').value = "";
  document.getElementById('pImg').value = "";
  document.getElementById('pDesc').value = "";

  loadData();
}

// ADD PROJECT
async function addProject(){
  const name = document.getElementById('prName').value;
  const img = document.getElementById('prImg').value;
  const description = document.getElementById('prDesc').value;

  if(!name) return alert("Fill required fields");

  const { error } = await supabaseClient.from('projects').insert([
    { name, img, description }
  ]);

  if(error){
    alert(error.message);
    console.error(error);
    return;
  }

  alert("Project added ✅");

  // clear inputs
  document.getElementById('prName').value = "";
  document.getElementById('prImg').value = "";
  document.getElementById('prDesc').value = "";

  loadData();
}

// RENDER PRODUCTS
function renderProducts(products){
  const list = document.getElementById('productList');
  list.innerHTML = '';

  products.forEach(p=>{
    list.innerHTML += `
      <div class="item">
        <b>${p.name}</b> - ₹${p.price}
      </div>
    `;
  });
}

// RENDER PROJECTS
function renderProjects(projects){
  const list = document.getElementById('projectList');
  list.innerHTML = '';

  projects.forEach(p=>{
    list.innerHTML += `
      <div class="item">
        <b>${p.name}</b>
      </div>
    `;
  });
}

loadData();
</script>

</body>
</html>
