<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shazim - Portfolio</title>

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0a0a0a;
  color:#e5e5e5;
  overflow-x:hidden;
}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:20px 6%;
  background:rgba(15,15,15,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f1f;
}

.nav a{
  color:#9ca3af;
  text-decoration:none;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px;
  perspective:1000px;
}

/* NEON RING */
.img-wrapper{
  position:relative;
  display:inline-block;
  border-radius:50%;
  padding:8px;
}

.img-wrapper::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  background:linear-gradient(45deg,#00f0ff,#7c3aed,#00f0ff);
  animation:rotate 4s linear infinite;
  z-index:-1;
  filter:blur(8px);
}

@keyframes rotate{
  0%{ transform:rotate(0deg); }
  100%{ transform:rotate(360deg); }
}

/* IMAGE */
.profile-img{
  width:150px;
  border-radius:50%;
  display:block;

  opacity:0;
  transform:translateX(-100px);
  animation:slideIn 1s ease forwards;
}

@keyframes slideIn{
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.hero h1{
  margin-top:20px;
  font-size:34px;
}

.hero p{
  color:#9ca3af;
}

/* PROJECTS */
.projects{
  max-width:900px;
  margin:auto;
  padding:50px 20px;
}

/* GLASS CARD */
.card{
  position:relative;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  padding:25px;
  border-radius:16px;
  margin-bottom:25px;
  overflow:hidden;

  transform:translateY(40px);
  opacity:0;
  animation:fadeUp 0.8s ease forwards;
}

.card:nth-child(1){ animation-delay:0.3s; }
.card:nth-child(2){ animation-delay:0.5s; }
.card:nth-child(3){ animation-delay:0.7s; }

@keyframes fadeUp{
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* LIGHT HOVER EFFECT */
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.08),transparent);
  transition:0.6s;
}

.card:hover::before{
  left:100%;
}

/* HOVER DEPTH */
.card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
}
</style>

</head>

<body>

<div class="nav">
  <h2>Mecknown</h2>
  <a href="about.html">← Back</a>
</div>

<section class="hero" id="hero">

  <div class="img-wrapper">
    <img src="shazim.png" class="profile-img">
  </div>

  <h1>Shazim</h1>
  <p>Robotics • App Development • Embedded Systems</p>

</section>

<section class="projects">

  <div class="card">
    <h3>Line Following Robot</h3>
    <p>PID controlled autonomous robot.</p>
  </div>

  <div class="card">
    <h3>Voice Assistant</h3>
    <p>Custom AI system with voice recognition.</p>
  </div>

  <div class="card">
    <h3>Gas Safety System</h3>
    <p>Smart MQ6-based safety automation.</p>
  </div>

</section>

<script>
/* PARALLAX EFFECT */
const hero = document.getElementById("hero");

document.addEventListener("mousemove", (e) => {
  let x = (window.innerWidth / 2 - e.clientX) / 25;
  let y = (window.innerHeight / 2 - e.clientY) / 25;

  hero.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
});
</script>

</body>
</html>
