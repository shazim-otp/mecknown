<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shazim - Portfolio</title>

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0a0a0a;
  color:#e5e5e5;
  overflow-x:hidden;
}

/* PAGE TRANSITION */
.transition{
  position:fixed;
  inset:0;
  background:#000;
  z-index:999;
  transform:translateY(100%);
  transition:0.6s ease;
}

/* CURSOR GLOW */
.cursor-glow{
  position:fixed;
  width:350px;
  height:350px;
  background:radial-gradient(circle, rgba(255,255,255,0.12), transparent 60%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:0;
  transition:0.08s linear;
}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:20px 6%;
  background:rgba(15,15,15,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f1f;
  position:relative;
  z-index:2;
}

.nav a{
  color:#9ca3af;
  text-decoration:none;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px;
  perspective:1000px;
  position:relative;
  z-index:2;
}

/* IMAGE */
.img-wrapper{
  padding:6px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
  box-shadow:0 0 40px rgba(255,255,255,0.2);
  display:inline-block;
}

.profile-img{
  width:150px;
  border-radius:50%;
  opacity:0;
  transform:translateX(-120px);
  animation:slideIn 1s ease forwards;
}

@keyframes slideIn{
  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* PROJECTS */
.projects{
  max-width:900px;
  margin:auto;
  padding:50px 20px;
  position:relative;
  z-index:2;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  padding:25px;
  border-radius:16px;
  margin-bottom:25px;
  cursor:pointer;
  transition:0.2s ease;
  position:relative;
}

/* LIGHT SWEEP */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.08),transparent);
  opacity:0;
  transition:0.4s;
}

.card:hover::before{
  opacity:1;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:5;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  background:#111;
  padding:30px;
  border-radius:14px;
  max-width:400px;
  text-align:center;
  border:1px solid #222;
}
</style>

</head>

<body>

<div class="transition" id="transition"></div>
<div class="cursor-glow" id="glow"></div>

<div class="nav">
  <h2>Mecknown</h2>
  <a href="about.html" onclick="goBack(event)">← Back</a>
</div>

<section class="hero" id="hero">
  <div class="img-wrapper">
    <img src="shazim.png" class="profile-img">
  </div>
  <h1>Shazim</h1>
  <p>Robotics • App Development • Embedded Systems</p>
</section>

<section class="projects">

  <div class="card" onmousemove="magnet(event,this)" onmouseleave="reset(this)"
       onclick="openModal('Line Following Robot','PID controlled robot.')">
    <h3>Line Following Robot</h3>
    <p>Interactive project</p>
  </div>

  <div class="card" onmousemove="magnet(event,this)" onmouseleave="reset(this)"
       onclick="openModal('Voice Assistant','Custom AI system.')">
    <h3>Voice Assistant</h3>
    <p>Interactive project</p>
  </div>

  <div class="card" onmousemove="magnet(event,this)" onmouseleave="reset(this)"
       onclick="openModal('Gas Safety System','MQ6 automation.')">
    <h3>Gas Safety System</h3>
    <p>Interactive project</p>
  </div>

</section>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="title"></h2>
    <p id="desc"></p>
  </div>
</div>

<script>
// CURSOR GLOW
const glow = document.getElementById("glow");
document.addEventListener("mousemove", e=>{
  glow.style.left = e.clientX+"px";
  glow.style.top = e.clientY+"px";
});

// PARALLAX
const hero = document.getElementById("hero");
document.addEventListener("mousemove", e=>{
  let x = (window.innerWidth/2 - e.clientX)/40;
  let y = (window.innerHeight/2 - e.clientY)/40;
  hero.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
});

// MAGNET EFFECT
function magnet(e,el){
  const rect = el.getBoundingClientRect();
  const x = e.clientX - rect.left - rect.width/2;
  const y = e.clientY - rect.top - rect.height/2;
  el.style.transform = `translate(${x*0.2}px, ${y*0.2}px)`;
}

function reset(el){
  el.style.transform = "translate(0,0)";
}

// MODAL
const modal = document.getElementById("modal");
function openModal(t,d){
  document.getElementById("title").innerText = t;
  document.getElementById("desc").innerText = d;
  modal.classList.add("active");
}
modal.onclick = ()=> modal.classList.remove("active");

// PAGE TRANSITION
function goBack(e){
  e.preventDefault();
  const t = document.getElementById("transition");
  t.style.transform = "translateY(0)";
  setTimeout(()=> window.location.href="about.html",500);
}
</script>

</body>
</html>
