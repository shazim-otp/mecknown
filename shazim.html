<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shazim - Portfolio</title>

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0a0a0a;
  color:#e5e5e5;
  overflow-x:hidden;
}

/* CURSOR GLOW */
.cursor-glow{
  position:fixed;
  width:300px;
  height:300px;
  background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 60%);
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:0;
}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:20px 6%;
  background:rgba(15,15,15,0.6);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #1f1f1f;
  position:relative;
  z-index:2;
}

.nav a{
  color:#9ca3af;
  text-decoration:none;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px;
  perspective:1000px;
  position:relative;
  z-index:2;
}

/* STATIC GLOW RING */
.img-wrapper{
  display:inline-block;
  padding:6px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
  box-shadow:0 0 30px rgba(255,255,255,0.15);
}

/* IMAGE SLIDE */
.profile-img{
  width:150px;
  border-radius:50%;

  opacity:0;
  transform:translateX(-100px);
  animation:slideIn 0.9s ease forwards;
}

@keyframes slideIn{
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.hero h1{
  margin-top:20px;
  font-size:34px;
}

.hero p{
  color:#9ca3af;
}

/* PROJECTS */
.projects{
  max-width:900px;
  margin:auto;
  padding:50px 20px;
  position:relative;
  z-index:2;
}

/* GLASS CARD */
.card{
  position:relative;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  padding:25px;
  border-radius:16px;
  margin-bottom:25px;
  cursor:pointer;
  overflow:hidden;

  opacity:0;
  transform:translateY(40px);
  animation:fadeUp 0.8s ease forwards;
}

.card:nth-child(1){ animation-delay:0.3s; }
.card:nth-child(2){ animation-delay:0.5s; }
.card:nth-child(3){ animation-delay:0.7s; }

@keyframes fadeUp{
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* LIGHT SWEEP */
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.08),transparent);
  transition:0.6s;
}

.card:hover::before{
  left:100%;
}

.card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:5;
}

.modal.active{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  background:#111;
  padding:30px;
  border-radius:14px;
  max-width:400px;
  text-align:center;
  border:1px solid #222;
}
</style>

</head>

<body>

<div class="cursor-glow" id="glow"></div>

<div class="nav">
  <h2>Mecknown</h2>
  <a href="about.html">← Back</a>
</div>

<section class="hero" id="hero">

  <div class="img-wrapper">
    <img src="shazim.png" class="profile-img">
  </div>

  <h1>Shazim</h1>
  <p>Robotics • App Development • Embedded Systems</p>

</section>

<section class="projects">

  <div class="card" onclick="openModal('Line Following Robot','PID controlled autonomous robot.')">
    <h3>Line Following Robot</h3>
    <p>Click to view more</p>
  </div>

  <div class="card" onclick="openModal('Voice Assistant','Custom AI with voice recognition.')">
    <h3>Voice Assistant</h3>
    <p>Click to view more</p>
  </div>

  <div class="card" onclick="openModal('Gas Safety System','MQ6 based smart automation.')">
    <h3>Gas Safety System</h3>
    <p>Click to view more</p>
  </div>

</section>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
  </div>
</div>

<script>
// cursor glow
const glow = document.getElementById("glow");
document.addEventListener("mousemove",(e)=>{
  glow.style.left = e.clientX+"px";
  glow.style.top = e.clientY+"px";
});

// parallax
const hero = document.getElementById("hero");
document.addEventListener("mousemove",(e)=>{
  let x = (window.innerWidth/2 - e.clientX)/30;
  let y = (window.innerHeight/2 - e.clientY)/30;
  hero.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
});

// modal
const modal = document.getElementById("modal");
function openModal(title,desc){
  document.getElementById("modal-title").innerText = title;
  document.getElementById("modal-desc").innerText = desc;
  modal.classList.add("active");
}

modal.onclick = () => modal.classList.remove("active");
</script>

</body>
</html>
