<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Class</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#0b1f3a;color:#fff;}

.navbar{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background:#0a1830;border-bottom:1px solid #1a2d4d;}
.nav-links a{color:#cbd5e1;text-decoration:none;margin-left:20px}
.nav-links a:hover{color:#00d4ff}

.container{max-width:900px;margin:auto;padding:25px;text-align:center}

h1{margin-bottom:10px}
.subtitle{color:#9fb3c8;margin-bottom:20px}

.live-card{
  background:#0a1830;
  border:1px solid #1a2d4d;
  border-radius:16px;
  padding:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.video-box{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden}
.video-box iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

.status{margin-top:12px;color:#9fb3c8}
.badge{display:inline-block;background:#ff3b3b;color:#fff;padding:4px 10px;border-radius:8px;font-size:12px;margin-left:8px}

.back{display:inline-block;margin-top:20px;padding:10px 16px;background:#00d4ff;color:#000;border-radius:8px;text-decoration:none;font-weight:600}
.back:hover{background:#00b8e6}

</style>
</head>
<body>

<div class="navbar">
  <div>Mecknown Academy</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="course.html">Course</a>
    <a href="live.html">Live</a>
  </div>
</div>

<div class="container">

<h1>Live Class</h1>
<p class="subtitle">Join your scheduled session</p>

<div class="live-card">
  <div class="video-box" id="liveBox"></div>
  <div class="status" id="status">Checking schedule...</div>
</div>

<a href="index.html" class="back">⬅ Back to Home</a>

</div>

<script>

fetch("data/class.json")
.then(res => res.json())
.then(data => {

  const liveBox = document.getElementById("liveBox");
  const status = document.getElementById("status");

  if(!data.live || !data.live.id || !data.live.time){
    status.innerText = "No live class scheduled";
    return;
  }

  const now = new Date().getTime();
  const start = new Date(data.live.time).getTime();

  if(now >= start){
    liveBox.innerHTML = `
      <iframe
        src="https://www.youtube.com/embed/${data.live.id}?modestbranding=1&rel=0&fs=1&playsinline=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    `;
    status.innerHTML = "Live Now <span class='badge'>LIVE</span>";
  }else{
    const diff = start - now;
    const mins = Math.floor(diff/60000);
    status.innerText = `Starts in ${mins} minutes`;
  }

});

</script>

</body>
</html>
