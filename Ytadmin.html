<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff;padding:20px}
.container{max-width:900px;margin:auto}
.card{background:#111;padding:20px;border-radius:12px;margin-bottom:20px}
h2{margin-top:0}
input,button{width:100%;padding:10px;margin:6px 0;border:none;border-radius:8px}
button{background:#fff;font-weight:600;cursor:pointer}
.list .item{background:#1a1a1a;padding:10px;border-radius:8px;margin-top:10px}
.actions button{width:auto;margin-right:5px;padding:6px 10px}
</style>
</head>
<body>
<div class="container">

<!-- LIVE CLASS -->
<div class="card">
<h2>Live Class Settings</h2>
<input id="liveID" placeholder="YouTube Video ID">
<input id="liveTime" type="datetime-local">
<button onclick="saveLive()">Save Live Class</button>
</div>

<!-- ADD PAST VIDEO -->
<div class="card">
<h2>Add Past Video</h2>
<input id="title" placeholder="Class Title">
<input id="video" placeholder="YouTube Video ID">
<button onclick="addVideo()">Add Video</button>
</div>

<!-- LIST -->
<div class="card">
<h2>Manage Videos</h2>
<div class="list" id="list"></div>
</div>

</div>

<script>

// ===== STORAGE =====
let classes = JSON.parse(localStorage.getItem("classes")||"[]");
let live = JSON.parse(localStorage.getItem("live")||"{}");

// ===== LIVE SAVE =====
function saveLive(){
  const id=document.getElementById("liveID").value;
  const time=document.getElementById("liveTime").value;

  localStorage.setItem("live",JSON.stringify({id,time}));
  alert("Live class saved");
}

// ===== ADD VIDEO =====
function addVideo(){
  const title=document.getElementById("title").value;
  const video=document.getElementById("video").value;

  classes.push({title,video});
  save();
  render();
}

function save(){
  localStorage.setItem("classes",JSON.stringify(classes));
}

// ===== DELETE =====
function removeVideo(i){
  classes.splice(i,1);
  save();
  render();
}

// ===== EDIT =====
function editVideo(i){
  const newTitle=prompt("Edit title",classes[i].title);
  const newVideo=prompt("Edit video ID",classes[i].video);

  if(newTitle && newVideo){
    classes[i]={title:newTitle,video:newVideo};
    save();
    render();
  }
}

// ===== RENDER =====
function render(){
  const list=document.getElementById("list");
  list.innerHTML="";

  classes.forEach((c,i)=>{
    list.innerHTML+=`
      <div class="item">
        <b>${c.title}</b><br>${c.video}
        <div class="actions">
          <button onclick="editVideo(${i})">Edit</button>
          <button onclick="removeVideo(${i})">Delete</button>
        </div>
      </div>
    `;
  });
}

render();

</script>
</body>
</html>
