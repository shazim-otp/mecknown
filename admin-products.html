<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Mecknown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  background:#0a0a0a;
  color:#fff;
  font-family:sans-serif;
}

/* LOGIN */
.login-box{
  max-width:350px;
  margin:80px auto;
  padding:20px;
  background:#111;
  border-radius:12px;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #333;
  background:#000;
  color:#fff;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

/* PANEL */
.panel{
  max-width:500px;
  margin:40px auto;
  padding:20px;
  background:#111;
  border-radius:12px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login-box">
  <h2>Admin Login</h2>
  <input type="email" id="email" placeholder="Admin Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- ADMIN PANEL -->
<div id="panel" class="panel" style="display:none;">
  <h2>Add Product</h2>

  <input type="text" id="name" placeholder="Product Name">
  <input type="number" id="price" placeholder="Price">
  <input type="text" id="desc" placeholder="Description">

  <input type="file" id="image">

  <button onclick="uploadProduct()">Upload Product</button>
  <button onclick="logout()">Logout</button>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDyh1Bi_29TpEG-_N3QijtxB7rdjLdHy3M",
  authDomain: "mecknownshop.firebaseapp.com",
  projectId: "mecknownshop"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "shazamotp@gmail.com";

/* LOGIN */
function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email,password)
  .catch(e => document.getElementById("error").innerText = e.message);
}

/* AUTH CHECK */
auth.onAuthStateChanged(user=>{
  if(user && user.email === ADMIN_EMAIL){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("panel").style.display="block";
  }
});

/* LOGOUT */
function logout(){
  auth.signOut();
  location.reload();
}

/* CLOUDINARY UPLOAD */
async function uploadProduct(){
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const desc = document.getElementById("desc").value;
  const file = document.getElementById("image").files[0];

  if(!file || !name || !price){
    alert("Fill all fields");
    return;
  }

  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", "mecknown_upload");

  try{
    const res = await fetch("https://api.cloudinary.com/v1_1/do8z7aoj4/image/upload",{
      method:"POST",
      body:fd
    });

    const data = await res.json();

    await db.collection("products").add({
      name,
      price,
      description: desc,
      image: data.secure_url,
      createdAt: new Date()
    });

    alert("✅ Product Uploaded!");

  }catch(err){
    alert("Upload failed");
    console.error(err);
  }
}

</script>

</body>
</html>
